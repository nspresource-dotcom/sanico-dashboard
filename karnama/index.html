<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#387F81" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C1817" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>کارنما | سامانهٔ مدیریت کار و عملکرد</title>

  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="کارنما">
  <link rel="manifest" href="./manifest.json">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- فونت گوگل جلوی نمایش صفحه را نمی‌گیرد: با media="print" بارگذاری می‌شود و
       بعد از رسیدن به all تبدیل می‌شود. اگر گوگل کند یا در دسترس نباشد،
       صفحه بلافاصله با فونت نصب‌شده روی خود دستگاه بالا می‌آید. -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="root"></div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="./app.js"></script>
  <script>
    // نصب روی صفحهٔ اصلی گوشی و باز شدن آفلاین
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
