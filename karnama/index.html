<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101822" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>کارنما | سامانهٔ مدیریت کار و عملکرد</title>

  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="کارنما">
  <link rel="manifest" href="./manifest.json">

  <link rel="preload" href="./vazirmatn.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="root"></div>
  <!-- کشوی گفت‌وگو عمداً بیرون از #root است: صفحه که دوباره رندر می‌شود،
       متنی که در حال تایپش هستید و جای اسکرول گفت‌وگو از بین نرود. -->
  <div id="chat"></div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="./app.js"></script>
  <script>
    // نصب روی صفحهٔ اصلی گوشی و باز شدن آفلاین
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
