<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سانیکو — داشبورد مدیریتی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f7f9;--panel:#fff;--ink:#15181d;--muted:#6a7280;--line:#e3e6ea;
  --accent:#0f5c4a;--accent2:#1f7a63;--warn:#a8511f;--danger:#9e2b2b;--ok:#2f6f4f;--neutral:#8a9099;
  --shadow:0 1px 2px rgba(16,20,26,.05),0 4px 16px rgba(16,20,26,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--panel:#161a21;--ink:#e8eaed;--muted:#9aa2ad;--line:#262c35;
  --accent:#4fd1ab;--accent2:#2f9e80;--warn:#e0954f;--danger:#e0736e;--ok:#63c396;--neutral:#737b86;
  --shadow:none;}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border-radius:10px;border:1px solid transparent}

.login{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.loginbox{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:26px 22px;box-shadow:var(--shadow)}
.loginbox h1{font-size:1.15rem;margin:0 0 4px}
.loginbox p.s{color:var(--muted);font-size:.82rem;margin:0 0 20px}
label{display:block;font-size:.78rem;color:var(--muted);margin:12px 0 5px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-family:inherit;font-size:.92rem}
input:focus{outline:2px solid var(--accent2);outline-offset:1px}
.btn{width:100%;padding:11px;background:var(--accent);color:#fff;font-weight:500;font-size:.92rem;margin-top:18px}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:none;color:var(--muted);font-size:.78rem;padding:10px 0 0;width:100%;text-decoration:underline}
.msg{margin-top:14px;font-size:.82rem;padding:9px 11px;border-radius:9px;display:none}
.msg.err{display:block;color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.msg.ok{display:block;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.top h1{font-size:1.18rem;margin:0 0 2px}
.top .s{color:var(--muted);font-size:.78rem;margin:0}
.who{font-size:.72rem;color:var(--muted);text-align:left;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.mini{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:.72rem;padding:4px 10px}
.fresh{font-size:.73rem;color:var(--muted);border:1px solid var(--line);background:var(--panel);
  border-radius:999px;padding:4px 12px;display:inline-block;margin:10px 0 2px}
.fresh.stale{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.crumb{display:flex;gap:7px;align-items:center;font-size:.8rem;margin:12px 0 2px}
.crumb button{background:none;border:none;color:var(--accent2);font-size:.8rem;padding:0;text-decoration:underline}

h2{font-size:.93rem;margin:26px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow);text-align:right;width:100%;display:block;color:inherit}
.kpi .l{font-size:.73rem;color:var(--muted);margin-bottom:5px;line-height:1.35}
.kpi .v{font-size:1.16rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .u{font-size:.67rem;color:var(--muted);font-weight:400;margin-right:3px}
.kpi .go{font-size:.68rem;color:var(--accent2);margin-top:4px}
.kpi.pos .v{color:var(--ok)}.kpi.neg .v{color:var(--danger)}.kpi.warn .v{color:var(--warn)}

.row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.row .nm{flex:0 0 40%;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tr{flex:1;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:5px;height:9px}
.row .bar{height:9px;border-radius:5px;background:var(--accent);display:block}
.row .bar.t{background:var(--neutral)}
.row .vl{flex:0 0 62px;text-align:left;font-size:.75rem;color:var(--muted);
  font-variant-numeric:tabular-nums;direction:ltr}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.81rem;min-width:400px}
th{text-align:right;font-weight:500;color:var(--muted);font-size:.72rem;padding:7px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left;direction:ltr}
td.neg{color:var(--danger);font-weight:700}
.pill{display:inline-block;font-size:.67rem;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.p1{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.p2{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.srch{margin-bottom:12px}
.spin{color:var(--muted);font-size:.84rem;padding:26px 0;text-align:center}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.74rem}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="loginbox">
    <h1>داشبورد مدیریتی سانیکو</h1>
    <p class="s">برای ورود، ایمیل و رمز عبور خود را وارد کنید.</p>
    <label for="em">ایمیل</label><input id="em" type="email" autocomplete="username" dir="ltr">
    <label for="pw">رمز عبور</label><input id="pw" type="password" autocomplete="current-password" dir="ltr">
    <button id="go" class="btn">ورود</button>
    <button id="reset" class="link">رمز عبور را فراموش کرده‌ام</button>
    <div id="lmsg" class="msg"></div>
  </div>
</div>

<div id="setpw" class="login hide">
  <div class="loginbox">
    <h1>تعیین رمز عبور</h1>
    <p class="s" id="pwwho">یک رمز عبور جدید انتخاب کنید.</p>
    <label for="np">رمز جدید</label><input id="np" type="password" autocomplete="new-password" dir="ltr">
    <label for="np2">تکرار رمز</label><input id="np2" type="password" autocomplete="new-password" dir="ltr">
    <button id="savepw" class="btn">ذخیره</button>
    <button id="cancelpw" class="link hide">انصراف</button>
    <div id="pmsg" class="msg"></div>
  </div>
</div>

<div id="app" class="wrap hide">
  <div class="top">
    <div><h1 id="ptitle">—</h1><p class="s" id="psub"></p></div>
    <div class="who">
      <div id="uinfo"></div>
      <div><button id="chpw" class="mini">تغییر رمز</button> <button id="logout" class="mini">خروج</button></div>
    </div>
  </div>
  <div id="crumb" class="crumb hide"><button id="back">← بازگشت به صفحه اصلی</button></div>
  <div id="fresh"></div>
  <div id="body"><div class="spin">در حال بارگذاری…</div></div>
  <footer>چیدمان این داشبورد در دیتابیس تعریف شده است. افزودن یا جابجایی شاخص‌ها نیازی به تغییر این صفحه ندارد.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL = "https://zlzjzzqrkbsqornnimlx.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_SC84u5DIOQgSgNI43KE6NQ_wWGGTg69";
var db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var $ = function (id) { return document.getElementById(id); };

var STATE = { role:"viewer", pages:[], widgets:[], cash:null, health:{}, page:"home" };
var CORE = null;

function bn(n){ if(n===null||n===undefined||n==="") return "—";
  return (Number(n)/1e9).toLocaleString("en-US",{maximumFractionDigits:1}); }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function prioCls(p){ if(!p) return ""; var c=String(p).trim().charAt(0);
  return (c==="\u06F1"||c==="1")?"p1":((c==="\u06F2"||c==="2")?"p2":""); }

function msg(t,k){ var m=$("lmsg"); m.textContent=t; m.className="msg "+k; }

$("go").addEventListener("click", async function(){
  var b=$("go"); b.disabled=true; b.textContent="در حال ورود…";
  var r=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  b.disabled=false; b.textContent="ورود";
  if(r.error){ msg("ایمیل یا رمز عبور درست نیست.","err"); return; }
  start();
});
$("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") $("go").click(); });

$("reset").addEventListener("click", async function(){
  var em=$("em").value.trim();
  if(!em){ msg("اول ایمیل خود را وارد کنید.","err"); return; }
  var r=await db.auth.resetPasswordForEmail(em,{redirectTo:location.href});
  msg(r.error?"ارسال ایمیل ناموفق بود.":"لینک بازنشانی رمز ایمیل شد.", r.error?"err":"ok");
});
$("logout").addEventListener("click", async function(){ await db.auth.signOut(); location.reload(); });

function fromEmailLink(){ var h=location.hash||"";
  return h.indexOf("type=invite")>-1||h.indexOf("type=recovery")>-1||h.indexOf("type=signup")>-1; }

function showSetPw(session,cancellable){
  $("login").classList.add("hide"); $("app").classList.add("hide");
  $("setpw").classList.remove("hide");
  $("cancelpw").classList.toggle("hide",!cancellable);
  if(session&&session.user) $("pwwho").textContent=session.user.email;
}
$("chpw").addEventListener("click", async function(){
  var s=await db.auth.getSession(); showSetPw(s.data.session,true);
});
$("cancelpw").addEventListener("click", function(){
  $("setpw").classList.add("hide"); $("app").classList.remove("hide");
});
$("savepw").addEventListener("click", async function(){
  var a=$("np").value, b2=$("np2").value, m=$("pmsg");
  if(a.length<8){ m.textContent="رمز باید حداقل ۸ کاراکتر باشد."; m.className="msg err"; return; }
  if(a!==b2){ m.textContent="دو رمز یکسان نیستند."; m.className="msg err"; return; }
  var btn=$("savepw"); btn.disabled=true; btn.textContent="در حال ذخیره…";
  var r=await db.auth.updateUser({password:a});
  btn.disabled=false; btn.textContent="ذخیره";
  if(r.error){ m.textContent="ذخیره نشد: "+r.error.message; m.className="msg err"; return; }
  history.replaceState(null,"",location.pathname);
  $("np").value=""; $("np2").value=""; m.className="msg";
  $("setpw").classList.add("hide"); start();
});

async function start(){
  var s=await db.auth.getSession();
  if(!s.data.session){ $("login").classList.remove("hide"); $("app").classList.add("hide"); return; }
  if(fromEmailLink()){ showSetPw(s.data.session,false); return; }
  $("login").classList.add("hide"); $("setpw").classList.add("hide");
  $("app").classList.remove("hide");
  await boot(s.data.session);
}

async function boot(session){
  var q=await Promise.all([
    db.from("profiles").select("full_name,email,role").eq("id",session.user.id).single(),
    db.from("dash_pages").select("*").eq("is_active",true).order("sort_order"),
    db.from("dash_widgets").select("*").eq("is_active",true).order("sort_order"),
    db.from("v_kpi_cash").select("cash_total").single(),
    db.from("v_data_health").select("*").single(),
    db.from("v_kpi_core").select("*").single()
  ]);
  var prof=q[0].data||{};
  STATE.role   = prof.role||"viewer";
  STATE.pages  = q[1].data||[];
  STATE.widgets= q[2].data||[];
  STATE.cash   = q[3].data? Number(q[3].data.cash_total) : null;
  STATE.health = q[4].data||{};
  CORE         = q[5].data||{};
  $("uinfo").textContent=(prof.full_name||session.user.email)+" · "+(STATE.role==="admin"?"مدیر":"مشاهده‌گر");
  freshness();
  go("home");
}

function freshness(){
  var d=STATE.health.last_data_change||STATE.health.last_sync;
  if(!d){ $("fresh").innerHTML=""; return; }
  var days=Math.floor((Date.now()-new Date(d).getTime())/86400000);
  var txt="داده تا "+new Date(d).toLocaleDateString("fa-IR")+" — "+(days<=0?"امروز":days+" روز پیش");
  $("fresh").innerHTML='<span class="fresh'+(days>14?" stale":"")+'">'+esc(txt)+"</span>";
}

function page(k){ return STATE.pages.filter(function(p){return p.key===k;})[0]; }

async function go(key){
  STATE.page=key;
  var p=page(key)||{title:key};
  $("ptitle").textContent=p.title;
  $("psub").textContent=p.subtitle||"";
  $("crumb").classList.toggle("hide", key==="home");
  $("body").innerHTML='<div class="spin">در حال خواندن…</div>';
  window.scrollTo(0,0);

  var ws=STATE.widgets.filter(function(w){
    return w.page_key===key && (!w.admin_only || STATE.role==="admin");
  });
  var parts=await Promise.all(ws.map(renderWidget));
  var h=parts.join("");

  if(key==="home"){
    var subs=STATE.pages.filter(function(x){return x.parent_key==="home";});
    h+='<h2>بخش‌ها</h2><div class="kpis">';
    subs.forEach(function(s){
      h+='<button class="kpi" data-go="'+esc(s.key)+'">'+
         '<div class="l">'+esc(s.subtitle||"")+'</div>'+
         '<div class="v" style="font-size:.95rem">'+esc(s.title)+'</div>'+
         '<div class="go">باز کردن ←</div></button>';
    });
    h+="</div>";
  }
  $("body").innerHTML=h;
  Array.prototype.forEach.call($("body").querySelectorAll("[data-go]"),function(el){
    el.addEventListener("click",function(){ go(el.getAttribute("data-go")); });
  });
  var si=$("srch"); if(si) si.addEventListener("input",filterRows);
}
$("back").addEventListener("click",function(){ go("home"); });

function applyOrder(q,cfg){
  if(cfg.order){
    var p=String(cfg.order).split(".");
    q=q.order(p[0],{ascending:p[1]!=="desc",nullsFirst:false});
  }
  if(cfg.limit) q=q.limit(cfg.limit);
  return q;
}

async function renderWidget(w){
  var cfg=w.cfg||{};
  if(w.kind==="kpi") return kpiWidget(w,cfg);
  var r=await applyOrder(db.from(w.source).select("*"),cfg);
  var rows=r.data||[];
  if(!rows.length) return "";
  if(w.kind==="bars")  return barsWidget(w,cfg,rows);
  if(w.kind==="table") return tableWidget(w,cfg,rows);
  return "";
}

function kpiWidget(w,cfg){
  var ctx={}; for(var k in CORE) ctx[k]=CORE[k];
  ctx.cash = (STATE.cash===null?0:STATE.cash);
  var val;
  if(cfg.expr){
    val=0; var sign=1;
    String(cfg.expr).split(/\s+/).forEach(function(tok){
      if(tok==="+") sign=1;
      else if(tok==="-") sign=-1;
      else if(tok) val += sign*Number(ctx[tok]||0);
    });
  } else {
    val = (w.source==="v_kpi_cash") ? STATE.cash : ctx[cfg.field];
  }
  if(val===null||val===undefined) return "";
  var tone=cfg.tone||"";
  if(tone==="signed") tone = (val<0?"neg":"pos");
  var shown=(cfg.tone==="signed"?(val<0?"−":"+"):"")+bn(Math.abs(val));
  var tag=cfg.link?' data-go="'+esc(cfg.link)+'"':"";
  return '<div class="kpis" style="margin-bottom:10px"><button class="kpi '+tone+'"'+tag+'>'+
    '<div class="l">'+esc(w.title)+'</div>'+
    '<div class="v">'+shown+'<span class="u">'+esc(cfg.unit||"")+'</span></div>'+
    (cfg.link?'<div class="go">مشاهده جزئیات ←</div>':"")+'</button></div>';
}

function barsWidget(w,cfg,rows){
  var max=0;
  rows.forEach(function(r){ max=Math.max(max,Math.abs(Number(r[cfg.value]||0))); });
  if(!max) max=1;
  var h='<h2>'+esc(w.title)+'</h2><div class="card">';
  rows.forEach(function(r){
    var v=Number(r[cfg.value]||0);
    var pct=Math.max(1,Math.round(Math.abs(v)/max*100));
    var flag=cfg.flag&&r[cfg.flag];
    h+='<div class="row"><span class="nm">'+esc(r[cfg.label])+'</span>'+
       '<span class="tr"><span class="bar'+(flag?" t":"")+'" style="width:'+pct+'%"></span></span>'+
       '<span class="vl">'+bn(v)+'</span></div>';
  });
  return h+"</div>";
}

function tableWidget(w,cfg,rows){
  var cols=cfg.columns||[];
  var h='<h2>'+esc(w.title)+'</h2>';
  if(cfg.search) h+='<input id="srch" class="srch" placeholder="جست‌وجو در شرح، دسته یا طرف حساب…">';
  h+='<div class="card scroll"><table><thead><tr>';
  cols.forEach(function(c){ h+="<th>"+esc(c.t)+"</th>"; });
  h+='</tr></thead><tbody'+(cfg.search?' id="rowsbody"':"")+">";
  var bal = (cfg.running==="cash") ? (STATE.cash||0) : null;
  rows.forEach(function(r){
    if(bal!==null) bal += Number(r.inflow_certain||0) - Number(r.firm_due||0);
    var key=((r.description||"")+" "+(r.category||"")+" "+(r.counterparty||"")).toLowerCase();
    h+='<tr data-k="'+esc(key)+'">';
    cols.forEach(function(c){
      var v = (c.k==="__balance") ? bal : r[c.k];
      if(c.n) h+='<td class="num'+(Number(v)<0?" neg":"")+'">'+bn(v)+"</td>";
      else if(c.pill) h+='<td><span class="pill '+prioCls(v)+'">'+
                        esc(String(v||"—").replace(/\s*-\s*.*/,""))+"</span></td>";
      else h+="<td>"+esc((v===null||v===undefined||v==="")?"—":v)+"</td>";
    });
    h+="</tr>";
  });
  return h+"</tbody></table></div>";
}

function filterRows(){
  var q=$("srch").value.trim().toLowerCase();
  Array.prototype.forEach.call(document.querySelectorAll("#rowsbody tr"),function(tr){
    tr.style.display = (!q || tr.getAttribute("data-k").indexOf(q)>-1) ? "" : "none";
  });
}

db.auth.onAuthStateChange(function(e,s){
  if(e==="PASSWORD_RECOVERY"){ showSetPw(s,false); return; }
  if(e==="SIGNED_IN") start();
});
start();
</script>
</body>
</html>
