<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سایا نیک — داشبورد مدیریتی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f3f6; --card:#ffffff; --ink:#111418; --ink2:#4b5563; --muted:#8a919c;
  --line:#e8ebef; --soft:#f6f7f9;
  --mint:#00c48c; --mint-d:#00a877; --indigo:#4338ca; --violet:#8b7cf6;
  --sky:#5aa9f7; --amber:#f5a524; --rose:#e5484d;
  --panel:#15323a; --panel-ink:#e9f5f1; --panel-line:#23454e;
  --r:20px; --sh:0 1px 2px rgba(17,20,24,.04), 0 8px 24px rgba(17,20,24,.06);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d10; --card:#14171c; --ink:#eef1f5; --ink2:#b4bcc7; --muted:#7c8694;
  --line:#242931; --soft:#1a1e24;
  --mint:#2ee6a8; --mint-d:#16c791; --indigo:#8b84ff; --violet:#a99dff;
  --sky:#6fb6ff; --amber:#f7b955; --rose:#ff7b7b;
  --panel:#12272e; --panel-ink:#e4f1ec; --panel-line:#1e3b44;
  --sh:none;
}}
:root[data-theme="dark"]{
  --bg:#0b0d10; --card:#14171c; --ink:#eef1f5; --ink2:#b4bcc7; --muted:#7c8694;
  --line:#242931; --soft:#1a1e24;
  --mint:#2ee6a8; --mint-d:#16c791; --indigo:#8b84ff; --violet:#a99dff;
  --sky:#6fb6ff; --amber:#f7b955; --rose:#ff7b7b;
  --panel:#12272e; --panel-ink:#e4f1ec; --panel-line:#1e3b44; --sh:none;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"ss01";}
button,input{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
.hide{display:none!important}

/* ---------- auth ---------- */
.auth{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.authbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
  border-radius:24px;padding:30px 26px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--mint),var(--mint-d));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:.78rem;letter-spacing:-.02em}
.authbox h1{font-size:1.1rem;margin:0;font-weight:700}
.authbox .sub{color:var(--muted);font-size:.82rem;margin:0 0 20px}
label{display:block;font-size:.78rem;color:var(--ink2);margin:14px 0 6px;font-weight:500}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;
  background:var(--soft);color:var(--ink);font-size:.92rem}
input:focus{outline:2px solid var(--mint);outline-offset:1px}
.btn{width:100%;padding:13px;border-radius:14px;background:var(--mint);color:#04281d;
  font-weight:700;font-size:.93rem;margin-top:20px}
.btn:disabled{opacity:.5}
.btn-ghost{width:100%;color:var(--muted);font-size:.79rem;padding:12px 0 0;text-decoration:underline}
.note{margin-top:14px;font-size:.82rem;padding:10px 12px;border-radius:12px;display:none}
.note.err{display:block;color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
.note.ok{display:block;color:var(--mint-d);background:color-mix(in srgb,var(--mint) 16%,transparent)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:var(--panel);color:var(--panel-ink);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .brand{margin-bottom:22px}
.side .brand h1{font-size:.98rem;color:var(--panel-ink)}
.nav{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
  color:#aeb6c2;font-size:.86rem;width:100%;text-align:right;transition:background .15s}
.nav:hover{background:rgba(255,255,255,.05)}
.nav.on{background:var(--mint);color:#04281d;font-weight:700}
.nav .ic{width:18px;height:18px;flex:0 0 18px}
.side .foot{margin-top:auto;border-top:1px solid var(--panel-line);padding-top:14px}

.main{flex:1;min-width:0;padding:20px 22px 60px}
.bar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 12px;box-shadow:var(--sh);margin-bottom:20px}
.bar .search{flex:1;background:var(--soft);border-radius:12px;padding:9px 13px;display:flex;
  align-items:center;gap:8px;color:var(--muted);font-size:.84rem}
.bar .search input{border:0;background:none;padding:0;font-size:.86rem}
.bar .search input:focus{outline:none}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;
  place-items:center;flex:0 0 38px;color:var(--ink2)}
.iconbtn.dark{background:var(--panel);color:var(--panel-ink)}
.avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--indigo));
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:0 0 38px}

.ptitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.ptitle h2{font-size:1.3rem;margin:0;font-weight:800;letter-spacing:-.02em}
.ptitle .psub{color:var(--muted);font-size:.82rem}
.stamp{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;color:var(--muted);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin:12px 0 20px}
.stamp b{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.stamp.stale b{background:var(--amber)}

/* ---------- grid + cards ---------- */
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--sh)}
.card h3{font-size:.9rem;margin:0 0 2px;font-weight:700}
.card .hint{font-size:.74rem;color:var(--muted);margin:0 0 14px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}

.kpi{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:17px 18px;box-shadow:var(--sh);transition:transform .12s,border-color .12s}
.kpi:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}
.kpi .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpi .lab{font-size:.78rem;color:var(--ink2);font-weight:500}
.kpi .chev{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);font-size:.7rem;flex:0 0 26px}
.kpi .val{font-size:1.62rem;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.kpi .unit{font-size:.7rem;color:var(--muted);font-weight:500;margin-right:5px}
.kpi .delta{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:.73rem;color:var(--muted)}
.kpi .delta .t{font-weight:700}
.up{color:var(--mint-d)} .down{color:var(--rose)} .warnc{color:var(--amber)}

/* ---------- bars ---------- */
.brow{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.brow .nm{flex:0 0 38%;font-size:.79rem;color:var(--ink2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.brow .track{flex:1;background:var(--soft);border-radius:8px;height:10px;overflow:hidden}
.brow .fill{height:10px;border-radius:8px;background:var(--violet);display:block}
.brow .fill.alt{background:var(--muted)}
.brow .vl{flex:0 0 58px;text-align:left;font-size:.76rem;font-weight:600;direction:ltr}

/* ---------- insight panel ---------- */
.panel{background:var(--panel);color:var(--panel-ink);border-radius:var(--r);padding:18px}
.panel h3{font-size:.9rem;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px}
.ins{display:flex;align-items:flex-start;gap:11px;background:rgba(255,255,255,.045);
  border-radius:14px;padding:11px 13px;margin-bottom:9px;font-size:.81rem;line-height:1.55}
.ins .dot{width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:grid;place-items:center;font-size:.8rem}
.d-warn{background:rgba(245,165,36,.18);color:var(--amber)}
.d-bad{background:rgba(229,72,77,.18);color:var(--rose)}
.d-good{background:rgba(0,196,140,.18);color:var(--mint)}
.d-info{background:rgba(139,124,246,.18);color:var(--violet)}

/* ---------- tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:420px}
th{text-align:right;font-weight:600;color:var(--muted);font-size:.72rem;padding:9px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--ink2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soft)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left;direction:ltr;
  color:var(--ink);font-weight:600}
td.neg{color:var(--rose)}
.pill{display:inline-block;font-size:.69rem;padding:3px 10px;border-radius:999px;font-weight:600;
  background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.p1{background:color-mix(in srgb,var(--rose) 14%,transparent);color:var(--rose)}
.pill.p2{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.pill.p3{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint-d)}

.spin{color:var(--muted);font-size:.85rem;padding:50px 0;text-align:center}
.more{font-size:.72rem;color:var(--mint-d);background:var(--soft);border-radius:999px;
  padding:5px 12px;font-weight:600;white-space:nowrap}
.ptn{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.ptn .nm{font-size:.92rem;font-weight:700;margin-bottom:2px}
.ptn .sh{font-size:.73rem;color:var(--muted);margin-bottom:14px}
.ptn .big{font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.ptn .meter{height:10px;border-radius:8px;background:var(--soft);margin:12px 0 10px;overflow:hidden}
.ptn .meter i{display:block;height:10px;border-radius:8px;background:var(--mint)}
.ptn .meter i.low{background:var(--amber)}
.ptn .meter i.bad{background:var(--rose)}
.ptn .legs{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.ptn .legs b{display:block;color:var(--ink);font-size:.85rem;font-weight:700;margin-top:2px}
.srch{margin-bottom:14px}

/* ---------- mobile ---------- */
@media(max-width:860px){
  .shell{display:block}
  .side{position:fixed;inset:0 auto 0 0;width:260px;transform:translateX(100%);
    transition:transform .22s ease;z-index:40;height:100dvh;
    padding-top:calc(22px + env(safe-area-inset-top,0px))}
  html[dir="rtl"] .side{right:0;left:auto;transform:translateX(100%)}
  .side.open{transform:translateX(0)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
  .main{padding:16px 15px 70px}
  .ptitle h2{font-size:1.15rem}
  .kpi .val{font-size:1.42rem}
}
@media(min-width:861px){ #burger,.scrim{display:none} }
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="auth" class="auth">
  <div class="authbox">
    <div class="brand"><div class="logo">سن</div>
      <div><h1>داشبورد مدیریتی سایا نیک</h1>
        <p class="sub" style="margin:0">کنترل مالی پروژه کارخانه</p></div></div>
    <label for="em">ایمیل</label><input id="em" type="email" autocomplete="username" dir="ltr">
    <label for="pw">رمز عبور</label><input id="pw" type="password" autocomplete="current-password" dir="ltr">
    <button id="go" class="btn">ورود</button>
    <button id="forgot" class="btn-ghost">رمز عبور را فراموش کرده‌ام</button>
    <div id="anote" class="note"></div>
  </div>
</div>

<div id="setpw" class="auth hide">
  <div class="authbox">
    <div class="brand"><div class="logo">سن</div><h1>تعیین رمز عبور</h1></div>
    <p class="sub" id="pwwho"></p>
    <label for="np">رمز جدید</label><input id="np" type="password" autocomplete="new-password" dir="ltr">
    <label for="np2">تکرار رمز</label><input id="np2" type="password" autocomplete="new-password" dir="ltr">
    <button id="savepw" class="btn">ذخیره</button>
    <button id="cancelpw" class="btn-ghost hide">انصراف</button>
    <div id="pnote" class="note"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="shell hide">
  <aside id="side" class="side">
    <div class="brand"><div class="logo">سن</div><h1>سایا نیک</h1></div>
    <div id="navs"></div>
    <div class="foot">
      <button class="nav" id="chpw">تغییر رمز عبور</button>
      <button class="nav" id="logout">خروج</button>
    </div>
  </aside>

  <main class="main">
    <div class="bar">
      <button id="burger" class="iconbtn">☰</button>
      <div class="search"><span>⌕</span><input id="q" placeholder="جست‌وجو در تراکنش‌ها…"></div>
      <button id="theme" class="iconbtn">☾</button>
      <div class="avatar" id="av">—</div>
    </div>

    <div class="ptitle"><h2 id="ptl">—</h2><span class="psub" id="psb"></span></div>
    <div id="stamp"></div>
    <div id="body"><div class="spin">در حال بارگذاری…</div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL = "https://zlzjzzqrkbsqornnimlx.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_SC84u5DIOQgSgNI43KE6NQ_wWGGTg69";
var db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var $ = function(id){ return document.getElementById(id); };

var S = { role:"viewer", pages:[], widgets:[], core:{}, cash:null, health:{},
          insights:[], periods:[], page:"home" };

/* ---------- formatting ---------- */
function fa(n){ return Number(n).toLocaleString("fa-IR"); }
function bn(n){ if(n===null||n===undefined||n==="") return "—";
  var v=Number(n)/1e9;
  return v.toLocaleString("fa-IR",{maximumFractionDigits:1}); }
function pct(n){ return n===null||n===undefined?"—":fa(Math.round(n))+"٪"; }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function prioCls(p){ if(!p) return ""; var c=String(p).trim().charAt(0);
  return (c==="\u06F1"||c==="1")?"p1":((c==="\u06F2"||c==="2")?"p2":"p3"); }

/* ---------- theme ---------- */
$("theme").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);
  $("theme").textContent = next==="dark" ? "☀" : "☾";
});

/* ---------- auth ---------- */
function anote(t,k){ var n=$("anote"); n.textContent=t; n.className="note "+k; }

$("go").addEventListener("click",async function(){
  var b=$("go"); b.disabled=true; b.textContent="در حال ورود…";
  var r=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  b.disabled=false; b.textContent="ورود";
  if(r.error){ anote("ایمیل یا رمز عبور درست نیست.","err"); return; }
  start();
});
$("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") $("go").click(); });
$("forgot").addEventListener("click",async function(){
  var em=$("em").value.trim();
  if(!em){ anote("اول ایمیل خود را وارد کنید.","err"); return; }
  var r=await db.auth.resetPasswordForEmail(em,{redirectTo:location.href});
  anote(r.error?"ارسال ایمیل ناموفق بود.":"لینک بازنشانی رمز ایمیل شد.", r.error?"err":"ok");
});
$("logout").addEventListener("click",async function(){ await db.auth.signOut(); location.reload(); });

function fromLink(){ var h=location.hash||"";
  return h.indexOf("type=invite")>-1||h.indexOf("type=recovery")>-1||h.indexOf("type=signup")>-1; }
function showSetPw(ses,cancel){
  $("auth").classList.add("hide"); $("app").classList.add("hide");
  $("setpw").classList.remove("hide");
  $("cancelpw").classList.toggle("hide",!cancel);
  if(ses&&ses.user) $("pwwho").textContent=ses.user.email;
}
$("chpw").addEventListener("click",async function(){
  var s=await db.auth.getSession(); showSetPw(s.data.session,true); closeSide();
});
$("cancelpw").addEventListener("click",function(){
  $("setpw").classList.add("hide"); $("app").classList.remove("hide"); });
$("savepw").addEventListener("click",async function(){
  var a=$("np").value,b2=$("np2").value,n=$("pnote");
  if(a.length<8){ n.textContent="رمز باید حداقل ۸ کاراکتر باشد."; n.className="note err"; return; }
  if(a!==b2){ n.textContent="دو رمز یکسان نیستند."; n.className="note err"; return; }
  var btn=$("savepw"); btn.disabled=true; btn.textContent="در حال ذخیره…";
  var r=await db.auth.updateUser({password:a});
  btn.disabled=false; btn.textContent="ذخیره";
  if(r.error){ n.textContent="ذخیره نشد: "+r.error.message; n.className="note err"; return; }
  history.replaceState(null,"",location.pathname);
  $("np").value=""; $("np2").value=""; n.className="note";
  $("setpw").classList.add("hide"); start();
});

/* ---------- sidebar ---------- */
function openSide(){ $("side").classList.add("open");
  var s=document.createElement("div"); s.className="scrim"; s.id="scrim";
  s.addEventListener("click",closeSide); document.body.appendChild(s); }
function closeSide(){ $("side").classList.remove("open");
  var s=$("scrim"); if(s) s.remove(); }
$("burger").addEventListener("click",openSide);

/* ---------- boot ---------- */
async function start(){
  var s=await db.auth.getSession();
  if(!s.data.session){ $("auth").classList.remove("hide"); $("app").classList.add("hide"); return; }
  if(fromLink()){ showSetPw(s.data.session,false); return; }
  $("auth").classList.add("hide"); $("setpw").classList.add("hide");
  $("app").classList.remove("hide");
  await boot(s.data.session);
}

async function boot(ses){
  var q=await Promise.all([
    db.from("profiles").select("full_name,email,role").eq("id",ses.user.id).single(),
    db.from("dash_pages").select("*").eq("is_active",true).order("sort_order"),
    db.from("dash_widgets").select("*").eq("is_active",true).order("sort_order"),
    db.from("v_kpi_core").select("*").single(),
    db.from("v_kpi_cash").select("cash_total").single(),
    db.from("v_data_health").select("*").single(),
    db.from("v_health_score").select("*").single(),
    db.from("v_insights").select("*").order("ord"),
    db.from("v_period_totals").select("*").order("sort_order")
  ]);
  var p=q[0].data||{};
  S.role=p.role||"viewer"; S.pages=q[1].data||[]; S.widgets=q[2].data||[];
  S.core=q[3].data||{}; S.cash=q[4].data?Number(q[4].data.cash_total):null;
  S.dataHealth=q[5].data||{}; S.health=q[6].data||{}; S.insights=q[7].data||[];
  S.periods=q[8].data||[];

  var nm=p.full_name||ses.user.email;
  $("av").textContent=nm.trim().charAt(0).toUpperCase();
  $("av").title=nm+" · "+(S.role==="admin"?"مدیر":"مشاهده‌گر");

  var icons={home:"◉",cash:"◈",commitments:"◆",spend:"▣",funding:"◇",health:"✚",rows:"☰"};
  $("navs").innerHTML=S.pages.map(function(pg){
    return '<button class="nav" data-go="'+esc(pg.key)+'">'+
           '<span class="ic">'+(icons[pg.key]||"•")+'</span>'+esc(pg.title)+"</button>";
  }).join("");
  bindGo($("navs"));
  stamp(); go("home");
}

function stamp(){
  var d=S.dataHealth.last_data_change||S.dataHealth.last_sync;
  if(!d){ $("stamp").innerHTML=""; return; }
  var days=Math.floor((Date.now()-new Date(d).getTime())/86400000);
  $("stamp").innerHTML='<span class="stamp'+(days>14?" stale":"")+'"><b></b>داده تا '+
    esc(new Date(d).toLocaleDateString("fa-IR"))+' — '+(days<=0?"امروز":fa(days)+" روز پیش")+'</span>';
}

function bindGo(root){
  Array.prototype.forEach.call(root.querySelectorAll("[data-go]"),function(el){
    el.addEventListener("click",function(){ go(el.getAttribute("data-go")); closeSide(); });
  });
}
function pageOf(k){ return S.pages.filter(function(p){return p.key===k;})[0]; }

/* ---------- render ---------- */
async function go(key){
  S.page=key;
  var p=pageOf(key)||{title:key};
  $("ptl").textContent=p.title; $("psb").textContent=p.subtitle||"";
  Array.prototype.forEach.call($("navs").children,function(b){
    b.classList.toggle("on", b.getAttribute("data-go")===key); });
  $("body").innerHTML='<div class="spin">در حال خواندن…</div>';
  window.scrollTo(0,0);

  var h = (key==="home") ? await home() : await sub(key);
  $("body").innerHTML=h;
  bindGo($("body"));
  bindDrill($("body"));
  var si=$("srch"); if(si) si.addEventListener("input",filterRows);
}

function bindDrill(root){
  Array.prototype.forEach.call(root.querySelectorAll("[data-full]"),function(el){
    el.addEventListener("click",function(ev){
      ev.stopPropagation();
      var p=el.getAttribute("data-full").split("|");
      fullList(p[0],p[1],p[2],p[3]);
    });
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-detail]"),function(el){
    el.addEventListener("click",function(){
      partnerDetail(el.getAttribute("data-detail").split("|")[1]);
    });
  });
}

async function home(){
  var ws=S.widgets.filter(function(w){
    return w.page_key==="home" && w.kind==="kpi" && (!w.admin_only||S.role==="admin"); });

  var h='<div class="grid g3" style="margin-bottom:14px">';
  h+=ws.map(kpiCard).join("");
  h+="</div>";

  h+=await partnerCards();

  h+='<div class="grid g2" style="margin-bottom:14px">';
  h+=healthCard();
  h+=insightCard();
  h+="</div>";

  h+='<div class="grid g2" style="margin-bottom:14px">';
  h+=await outlookCard();
  h+=await spendCard();
  h+="</div>";
  return h;
}

async function partnerCards(){
  var r=await db.from("v_partner_contributions").select("*").order("share_pct",{ascending:false});
  var rows=r.data||[]; if(!rows.length) return "";
  var h='<h2 style="font-size:.95rem;margin:4px 0 10px;font-weight:700">آورده شرکا</h2>'+
        '<div class="grid g2" style="margin-bottom:14px">';
  rows.forEach(function(x){
    var pg=Math.max(0,Math.min(100,Number(x.progress_pct)));
    var cls = pg>=70 ? "" : (pg>=40 ? "low" : "bad");
    h+='<button class="ptn" data-detail="partner|'+esc(x.subcategory_name)+'">'+
      '<div class="nm">'+esc(x.partner_label)+'</div>'+
      '<div class="sh">سهم '+fa(Number(x.share_pct))+'٪ از سرمایه مصوب</div>'+
      '<div class="big">'+bn(x.paid_rial)+'<span class="unit" style="font-size:.7rem;color:var(--muted);'+
      'font-weight:500;margin-right:5px">از '+bn(x.target_rial)+' میلیارد ریال</span></div>'+
      '<div class="meter"><i class="'+cls+'" style="width:'+pg+'%"></i></div>'+
      '<div class="legs"><span>آورده تا کنون<b>'+fa(pg)+'٪</b></span>'+
      '<span style="text-align:left">مانده تعهد<b>'+bn(x.remaining_rial)+'</b></span></div>'+
      '</button>';
  });
  return h+'</div>';
}

/* a bar chart only has room for a few rows; this opens the whole list */
async function fullList(src,label,value,title){
  $("ptl").textContent=title; $("psb").textContent="فهرست کامل";
  $("crumb").classList.remove("hide");
  $("body").innerHTML='<div class="spin">در حال خواندن…</div>';
  window.scrollTo(0,0);
  var r=await db.from(src).select("*").order(value,{ascending:false});
  var rows=r.data||[];
  var tot=rows.reduce(function(a,x){return a+Number(x[value]||0);},0)||1;
  var h='<div class="card"><div class="chead"><div><h3>'+esc(title)+'</h3>'+
    '<p class="hint">'+fa(rows.length)+' ردیف · جمع '+bn(tot)+' میلیارد ریال</p></div></div>'+
    '<div class="scroll"><table><thead><tr><th>عنوان</th><th>مبلغ</th><th>سهم</th></tr></thead><tbody>';
  rows.forEach(function(x){
    var v=Number(x[value]||0);
    h+='<tr><td>'+esc(x[label])+'</td><td class="num">'+bn(v)+'</td>'+
       '<td class="num">'+fa(Math.round(v/tot*1000)/10)+'٪</td></tr>';
  });
  $("body").innerHTML=h+'</tbody></table></div></div>';
}

async function partnerDetail(sub){
  $("ptl").textContent="جزئیات آورده"; $("psb").textContent=sub;
  $("crumb").classList.remove("hide");
  $("body").innerHTML='<div class="spin">در حال خواندن…</div>';
  window.scrollTo(0,0);
  var r=await db.from("v_partner_detail").select("*").eq("partner",sub)
          .order("total_rial",{ascending:false});
  var rows=r.data||[];
  var tot=rows.reduce(function(a,x){return a+Number(x.total_rial||0);},0);
  var h='<div class="card"><div class="chead"><div><h3>'+esc(sub)+'</h3>'+
    '<p class="hint">'+fa(rows.length)+' واریز · جمع '+bn(tot)+' میلیارد ریال</p></div></div>'+
    '<div class="scroll"><table><thead><tr><th>شرح</th><th>دوره</th><th>مبلغ</th></tr></thead><tbody>';
  rows.forEach(function(x){
    h+='<tr><td>'+esc(x.description)+'</td><td>'+esc(x.period)+'</td>'+
       '<td class="num">'+bn(x.total_rial)+'</td></tr>';
  });
  $("body").innerHTML=h+'</tbody></table></div></div>';
}

function kpiCard(w){
  var c=w.cfg||{}, ctx={}; for(var k in S.core) ctx[k]=S.core[k];
  ctx.cash = S.cash===null?0:S.cash;
  var val;
  if(c.expr){ val=0; var sg=1;
    String(c.expr).split(/\s+/).forEach(function(t){
      if(t==="+") sg=1; else if(t==="-") sg=-1; else if(t) val+=sg*Number(ctx[t]||0); });
  } else { val = (w.source==="v_kpi_cash") ? S.cash : ctx[c.field]; }
  if(val===null||val===undefined) return "";

  var cls = c.tone==="signed" ? (val<0?"down":"up") : (c.tone==="neg"?"down":(c.tone==="warn"?"warnc":""));
  var shown=(c.tone==="signed"?(val<0?"−":"+"):"")+bn(Math.abs(val));

  var delta="";
  if(w.source==="v_kpi_cash" && S.periods.length>1){
    var last=S.periods[S.periods.length-1];
    var net=Number(last.net);
    delta='<div class="delta"><span class="t '+(net>=0?"up":"down")+'">'+
      (net>=0?"▲":"▼")+" "+bn(Math.abs(net))+'</span><span>خالص دوره '+esc(last.code)+'</span></div>';
  }
  return '<button class="kpi '+cls+'" data-go="'+esc(c.link||"home")+'">'+
    '<div class="top"><span class="lab">'+esc(w.title)+'</span><span class="chev">‹</span></div>'+
    '<div class="val">'+shown+'<span class="unit">'+esc(c.unit||"")+'</span></div>'+
    delta+"</button>";
}

function ring(){
  var H=S.health, R=[
    {k:"cash_cover_pct", c:"var(--mint)",   t:"پوشش نقدی"},
    {k:"funded_pct",     c:"var(--sky)",    t:"تأمین کل"},
    {k:"near_term_pct",  c:"var(--indigo)", t:"کوتاه‌مدت"},
    {k:"flexibility_pct",c:"var(--amber)",  t:"انعطاف"}
  ];
  var s='<svg viewBox="0 0 180 180" style="width:170px;height:170px;display:block;margin:0 auto">';
  R.forEach(function(r,i){
    var rad=76-i*15, cx=90, cy=90, C=2*Math.PI*rad;
    var v=Math.max(0,Math.min(100,Number(H[r.k]||0)));
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rad+'" fill="none" stroke="var(--soft)" stroke-width="9"/>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rad+'" fill="none" stroke="'+r.c+'" stroke-width="9"'+
       ' stroke-linecap="round" stroke-dasharray="'+(C*v/100)+' '+C+'"'+
       ' transform="rotate(-90 '+cx+' '+cy+')"/>';
  });
  s+='<text x="90" y="86" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)"'+
     ' font-family="Vazirmatn">'+fa(H.score||0)+'</text>';
  s+='<text x="90" y="104" text-anchor="middle" font-size="11" fill="var(--muted)"'+
     ' font-family="Vazirmatn">از ۱۰۰</text></svg>';

  var leg='<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px">';
  R.forEach(function(r){
    leg+='<div style="font-size:.73rem;color:var(--muted);display:flex;align-items:center;gap:6px">'+
      '<i style="width:9px;height:9px;border-radius:50%;background:'+r.c+';display:inline-block"></i>'+
      esc(r.t)+' <b style="color:var(--ink)">'+pct(H[r.k])+'</b></div>';
  });
  return s+leg+"</div>";
}

function healthCard(){
  var sc=Number(S.health.score||0);
  var tag = sc>=75?["عالی","var(--mint)"] : sc>=55?["قابل قبول","var(--amber)"] : ["نیازمند توجه","var(--rose)"];
  return '<div class="card"><div class="chead"><div>'+
    '<h3>وضعیت مالی پروژه</h3><p class="hint">میانگین وزنی چهار نسبت زیر</p></div>'+
    '<span class="pill" style="background:color-mix(in srgb,'+tag[1]+' 16%,transparent);color:'+tag[1]+'">'+
    tag[0]+'</span></div>'+ring()+'</div>';
}

function insightCard(){
  var ico={warn:"!",bad:"✕",good:"✓",info:"i"};
  var h='<div class="panel"><h3>یافته‌های سیستم</h3>';
  S.insights.forEach(function(i){
    h+='<div class="ins"><span class="dot d-'+esc(i.tone)+'">'+(ico[i.tone]||"•")+'</span>'+
       '<span>'+esc(i.text)+'</span></div>';
  });
  return h+'</div>';
}

async function outlookCard(){
  var r=await db.from("v_monthly_outlook").select("*").order("month_code").limit(6);
  var rows=r.data||[]; if(!rows.length) return "";
  var bal=(S.cash||0), pts=[], labs=[];
  rows.forEach(function(x){ bal+=Number(x.inflow_certain)-Number(x.firm_due);
    pts.push(bal/1e9); labs.push(String(x.month_name).replace(" 1405","")); });
  var max=Math.max.apply(null,pts.concat([0]))*1.15||1;
  var min=Math.min.apply(null,pts.concat([0]))*1.15;
  var W=520,H=190,pad=24;
  function X(i){ return pad+ i*(W-pad*2)/Math.max(1,pts.length-1); }
  function Y(v){ return H-pad-((v-min)/(max-min||1))*(H-pad*2); }
  var d=pts.map(function(v,i){ return (i?"L":"M")+X(i)+" "+Y(v); }).join(" ");
  var area=d+" L"+X(pts.length-1)+" "+Y(min)+" L"+X(0)+" "+Y(min)+" Z";

  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+
    '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--mint)" stop-opacity=".30"/>'+
    '<stop offset="100%" stop-color="var(--mint)" stop-opacity="0"/></linearGradient></defs>';
  if(min<0) s+='<line x1="'+pad+'" y1="'+Y(0)+'" x2="'+(W-pad)+'" y2="'+Y(0)+
    '" stroke="var(--rose)" stroke-width="1" stroke-dasharray="4 4"/>';
  s+='<path d="'+area+'" fill="url(#g1)"/>';
  s+='<path d="'+d+'" fill="none" stroke="var(--mint)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(v,i){
    s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4" fill="var(--card)" stroke="var(--mint)" stroke-width="2.5"/>';
    s+='<text x="'+X(i)+'" y="'+(Y(v)-11)+'" text-anchor="middle" font-size="10.5" font-weight="700"'+
       ' fill="'+(v<0?"var(--rose)":"var(--ink)")+'" font-family="Vazirmatn">'+bn(v*1e9)+'</text>';
    s+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10"'+
       ' fill="var(--muted)" font-family="Vazirmatn">'+esc(labs[i])+'</text>';
  });
  s+="</svg>";
  return '<div class="card"><div class="chead"><div><h3>مسیر نقدینگی</h3>'+
    '<p class="hint">موجودی پایان ماه، سناریوی قطعی — میلیارد ریال</p></div></div>'+s+'</div>';
}

async function spendCard(){
  var r=await db.from("v_spend_by_category").select("*").order("total_rial",{ascending:false}).limit(8);
  var rows=r.data||[]; if(!rows.length) return "";
  var max=Number(rows[0].total_rial)||1;
  var h='<div class="card"><div class="chead"><div><h3>مخارج به تفکیک دسته</h3>'+
    '<p class="hint">میلیارد ریال — بدون قرض بین‌شرکتی و کالای بازرگانی</p></div>'+
    '<button class="more" data-full="v_spend_by_category|category|total_rial|مخارج به تفکیک دسته">'+
    'مشاهده کامل ←</button></div>';
  rows.forEach(function(x){
    var w=Math.max(2,Math.round(Number(x.total_rial)/max*100));
    h+='<div class="brow"><span class="nm">'+esc(x.category)+'</span>'+
       '<span class="track"><span class="fill'+(x.is_transfer?" alt":"")+'" style="width:'+w+'%"></span></span>'+
       '<span class="vl">'+bn(x.total_rial)+'</span></div>';
  });
  return h+'</div>';
}

/* ---------- sub pages (config driven) ---------- */
async function sub(key){
  var ws=S.widgets.filter(function(w){
    return w.page_key===key && w.kind!=="kpi" && (!w.admin_only||S.role==="admin"); });
  var parts=await Promise.all(ws.map(widget));
  return parts.join("") || '<div class="card"><p class="hint" style="margin:0">موردی برای نمایش نیست.</p></div>';
}

async function widget(w){
  var c=w.cfg||{};
  var q=db.from(w.source).select("*");
  if(c.order){ var p=String(c.order).split(".");
    q=q.order(p[0],{ascending:p[1]!=="desc",nullsFirst:false}); }
  if(c.limit) q=q.limit(c.limit); else q=q.limit(10);
  var r=await q; var rows=r.data||[];
  if(!rows.length) return "";
  return w.kind==="bars" ? bars(w,c,rows) : table(w,c,rows);
}

function bars(w,c,rows){
  var max=0; rows.forEach(function(r){ max=Math.max(max,Math.abs(Number(r[c.value]||0))); });
  if(!max) max=1;
  var more='<button class="more" data-full="'+esc(w.source)+'|'+esc(c.label)+'|'+
           esc(c.value)+'|'+esc(w.title)+'">مشاهده کامل ←</button>';
  var h='<div class="card" style="margin-bottom:14px"><div class="chead"><div><h3>'+
        esc(w.title)+'</h3></div>'+more+'</div>';
  rows.forEach(function(r){
    var v=Number(r[c.value]||0), pw=Math.max(2,Math.round(Math.abs(v)/max*100));
    h+='<div class="brow"><span class="nm">'+esc(r[c.label])+'</span>'+
       '<span class="track"><span class="fill'+(c.flag&&r[c.flag]?" alt":"")+
       '" style="width:'+pw+'%"></span></span><span class="vl">'+bn(v)+'</span></div>';
  });
  return h+'</div>';
}

function table(w,c,rows){
  var cols=c.columns||[];
  var h='<div class="card" style="margin-bottom:14px"><h3>'+esc(w.title)+'</h3><p class="hint"></p>';
  if(c.search) h+='<input id="srch" class="srch" placeholder="جست‌وجو در شرح، دسته یا طرف حساب…">';
  h+='<div class="scroll"><table><thead><tr>';
  cols.forEach(function(x){ h+="<th>"+esc(x.t)+"</th>"; });
  h+='</tr></thead><tbody'+(c.search?' id="rowsbody"':"")+">";
  var bal=(c.running==="cash")?(S.cash||0):null;
  rows.forEach(function(r){
    if(bal!==null) bal+=Number(r.inflow_certain||0)-Number(r.firm_due||0);
    var k=((r.description||"")+" "+(r.category||"")+" "+(r.counterparty||"")).toLowerCase();
    h+='<tr data-k="'+esc(k)+'">';
    cols.forEach(function(x){
      var v=(x.k==="__balance")?bal:r[x.k];
      if(x.n) h+='<td class="num'+(Number(v)<0?" neg":"")+'">'+bn(v)+"</td>";
      else if(x.pill) h+='<td><span class="pill '+prioCls(v)+'">'+
        esc(String(v||"—").replace(/\s*-\s*.*/,""))+"</span></td>";
      else h+="<td>"+esc((v===null||v===undefined||v==="")?"—":v)+"</td>";
    });
    h+="</tr>";
  });
  return h+"</tbody></table></div></div>";
}

function filterRows(){
  var q=$("srch").value.trim().toLowerCase();
  Array.prototype.forEach.call(document.querySelectorAll("#rowsbody tr"),function(tr){
    tr.style.display=(!q||tr.getAttribute("data-k").indexOf(q)>-1)?"":"none"; });
}

/* global search jumps to the rows page */
$("q").addEventListener("keydown",async function(e){
  if(e.key!=="Enter") return;
  await go("rows");
  var si=$("srch"); if(si){ si.value=$("q").value; filterRows(); }
});

db.auth.onAuthStateChange(function(e,s){
  if(e==="PASSWORD_RECOVERY"){ showSetPw(s,false); return; }
  if(e==="SIGNED_IN") start();
});
start();
</script>
