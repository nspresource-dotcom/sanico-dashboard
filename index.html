<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سایا نیک — داشبورد مدیریتی</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1b4d3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سایا نیک">
<link rel="apple-touch-icon" href="./IMG_9351.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --canvas:#f2f5f3; --card:#ffffff; --rail:#ffffff;
  --ink:#16302a; --ink2:#50635c; --muted:#8c9a95; --line:#e8edea;
  --deep:#1b4d3e; --deep2:#2a6b56;
  --mint:#54cf96; --mint2:#86e0b7; --mint-s:#e7f5ec; --mint-s2:#d5ecdf;
  --amber:#b4791f; --amber-s:#fbf0da; --rose:#c43a3f; --rose-s:#fbe6e6;
  --grey-s:#eef1ef;
  --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(22,48,42,.04), 0 10px 26px rgba(22,48,42,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0d1411; --card:#141d19; --rail:#111a16;
  --ink:#e8f1ec; --ink2:#b2c3bb; --muted:#7d8e87; --line:#20302a;
  --deep:#3fae86; --deep2:#58c79c;
  --mint:#54cf96; --mint2:#2f8f68; --mint-s:#17291f; --mint-s2:#1d3528;
  --amber:#e0a954; --amber-s:#2c2415; --rose:#e87b7f; --rose-s:#2d1a1b;
  --grey-s:#1a2621; --sh:none;
}}
:root[data-theme="dark"]{
  --canvas:#0d1411; --card:#141d19; --rail:#111a16;
  --ink:#e8f1ec; --ink2:#b2c3bb; --muted:#7d8e87; --line:#20302a;
  --deep:#3fae86; --deep2:#58c79c;
  --mint:#54cf96; --mint2:#2f8f68; --mint-s:#17291f; --mint-s2:#1d3528;
  --amber:#e0a954; --amber-s:#2c2415; --rose:#e87b7f; --rose-s:#2d1a1b;
  --grey-s:#1a2621; --sh:none;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.6;
  font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
.hide{display:none!important}

/* ---------- auth ---------- */
.auth{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.authbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
  border-radius:24px;padding:30px 26px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--deep);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem;letter-spacing:-.02em}
.authbox h1{font-size:1.1rem;margin:0;font-weight:700}
.authbox .sub{color:var(--muted);font-size:.82rem;margin:0 0 18px}
label{display:block;font-size:.78rem;color:var(--ink2);margin:14px 0 6px;font-weight:500}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--canvas);color:var(--ink);font-size:.92rem}
input:focus{outline:2px solid var(--mint);outline-offset:1px}
.btn{width:100%;padding:13px;border-radius:var(--r-sm);background:var(--deep);color:#fff;
  font-weight:700;font-size:.93rem;margin-top:20px}
.btn:disabled{opacity:.5}
.btn-ghost{width:100%;color:var(--muted);font-size:.79rem;padding:12px 0 0;text-decoration:underline}
.note{margin-top:14px;font-size:.82rem;padding:10px 12px;border-radius:var(--r-sm);display:none}
.note.err{display:block;color:var(--rose);background:var(--rose-s)}
.note.ok{display:block;color:var(--deep);background:var(--mint-s)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;background:var(--canvas)}
.side{width:244px;flex:0 0 244px;background:var(--rail);padding:22px 16px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
  border-left:1px solid var(--line)}
.side .brand{margin:0 6px 24px;width:calc(100% - 12px);background:none;border:0;padding:4px 2px;cursor:pointer;font:inherit;color:inherit;text-align:right;border-radius:12px;transition:background .15s}
.side .brand:hover{background:rgba(27,77,62,.07)}
.side .brand h1{font-size:1.02rem;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  color:var(--ink2);font-size:.87rem;width:100%;text-align:right;transition:background .15s,color .15s}
.nav:hover{background:var(--grey-s)}
.nav.on{background:var(--deep);color:#fff;font-weight:700}
.nav .ic{width:19px;height:19px;flex:0 0 19px;display:grid;place-items:center;font-size:.95rem}
.nav.parent{justify-content:space-between}
.nav .caret{font-size:.7rem;color:var(--muted);transition:transform .18s}
.nav.open .caret{transform:rotate(-90deg)}
.kids{overflow:hidden;max-height:0;transition:max-height .22s ease}
.kids.open{max-height:260px}
.kids button{display:block;width:100%;text-align:right;padding:10px 14px 10px 40px;
  border-radius:12px;font-size:.81rem;color:var(--ink2)}
.kids button:hover{background:var(--grey-s)}
.kids button.on{background:var(--mint-s);color:var(--deep);font-weight:700}
.side .promo{margin-top:auto;background:linear-gradient(160deg,var(--mint-s2),var(--mint-s));
  border-radius:var(--r);padding:16px;margin-bottom:8px}
.side .promo h4{margin:0 0 5px;font-size:.84rem;font-weight:700;color:var(--deep)}
.side .promo p{margin:0;font-size:.73rem;color:var(--ink2);line-height:1.55}
.side .promo .n{font-size:1.15rem;font-weight:800;color:var(--deep);margin-top:6px;display:block}
.side .bot{border-top:1px solid var(--line);padding-top:10px}

.main{flex:1;min-width:0;padding:22px 24px 56px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:1.45rem;margin:0;font-weight:800;letter-spacing:-.03em;flex:0 0 auto}
.top .sp{flex:1}
.search{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;display:flex;align-items:center;gap:9px;color:var(--muted);
  font-size:.84rem;min-width:180px;max-width:320px;flex:1}
.search input{border:0;background:none;padding:0;font-size:.86rem}
.search input:focus{outline:none}
.icons{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px}
.ib{width:36px;height:36px;border-radius:50%;background:var(--mint-s);display:grid;
  place-items:center;color:var(--deep);font-size:.9rem}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px 14px 4px 4px}
.me .av{width:36px;height:36px;border-radius:50%;background:var(--deep);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:.82rem}
.me .nm{font-size:.82rem;font-weight:700;line-height:1.2}
.me .rl{font-size:.7rem;color:var(--muted)}

/* ---------- hero ---------- */
.hero{background:var(--mint-s);border-radius:22px;padding:22px;margin-bottom:16px;
  display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px;align-items:center}
.hero .wel h3{margin:0 0 6px;font-size:1.3rem;font-weight:800;letter-spacing:-.03em;color:var(--deep)}
.hero .wel p{margin:0;font-size:.83rem;color:var(--ink2);line-height:1.65}
.hero .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero .trio{grid-template-columns:1fr}}

/* ---------- kpi ---------- */
.kpi{display:block;width:100%;text-align:right;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.kpi .bd{padding:16px 17px 14px}
.kpi .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.kpi .lab{font-size:.79rem;color:var(--ink2);font-weight:500;line-height:1.45}
.kpi .hz{color:var(--muted);font-weight:600;font-size:.72rem;white-space:nowrap}
.kpi .chip{width:36px;height:36px;border-radius:11px;background:var(--mint-s);color:var(--deep);
  display:grid;place-items:center;font-size:.95rem;flex:0 0 36px}
.kpi .val{font-size:1.5rem;font-weight:800;letter-spacing:-.035em;line-height:1.2;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .unit{font-size:.68rem;color:var(--muted);font-weight:500}
.kpi .ft{background:var(--mint-s);padding:9px 17px;display:flex;justify-content:space-between;
  align-items:center;font-size:.73rem;color:var(--ink2)}
.kpi .ft .go{color:var(--deep);font-weight:700}
.tag{font-size:.69rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.up{background:var(--mint-s2);color:var(--deep)}
.tag.down{background:var(--rose-s);color:var(--rose)}
.tag.warn{background:var(--amber-s);color:var(--amber)}
.kpi.neg .val{color:var(--rose)} .kpi.warn .val{color:var(--amber)} .kpi.pos .val{color:var(--deep)}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1040px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--sh)}
.card h3{font-size:.95rem;margin:0;font-weight:700;letter-spacing:-.01em}
.card .hint{font-size:.74rem;color:var(--muted);margin:3px 0 0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.more{font-size:.73rem;color:var(--deep);background:var(--mint-s);border-radius:999px;
  padding:6px 13px;font-weight:700;white-space:nowrap}

/* ---------- bars ---------- */
.brow{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.brow .nm{flex:0 0 38%;font-size:.79rem;color:var(--ink2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.brow .track{flex:1;background:var(--grey-s);border-radius:7px;height:11px;overflow:hidden}
.brow .fill{height:11px;border-radius:7px;background:var(--mint);display:block}
.brow .fill.alt{background:var(--muted)}
.brow .fill i{display:block;height:11px}
.brow .cnt{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;
  background:var(--grey-s);color:var(--muted);font-size:.67rem;font-weight:700;vertical-align:middle}
.brow .vl{flex:0 0 auto;min-width:60px;text-align:left;font-size:.75rem;font-weight:700;
  direction:ltr;white-space:nowrap}
body.rial .brow .nm{flex:0 0 28%}
body.rial .kpi .val{font-size:1.12rem;letter-spacing:-.02em}
body.rial .ptn .big{font-size:1.1rem}
body.rial td.num{font-size:.78rem}

/* ---------- insight panel ---------- */
.panel{background:var(--deep);color:#eaf6f0;border-radius:var(--r);padding:18px}
.panel h3{font-size:.95rem;margin:0 0 14px;font-weight:700}
.ins{display:flex;align-items:flex-start;gap:11px;background:rgba(255,255,255,.07);
  border-radius:14px;padding:12px 13px;margin-bottom:9px;font-size:.81rem;line-height:1.6}
.ins .dot{width:28px;height:28px;border-radius:9px;flex:0 0 28px;display:grid;
  place-items:center;font-size:.8rem;font-weight:700}
.d-warn{background:rgba(224,169,84,.22);color:#f2c37a}
.d-bad{background:rgba(232,123,127,.22);color:#f3a2a4}
.d-good{background:rgba(84,207,150,.22);color:#8ee5b9}
.d-info{background:rgba(255,255,255,.14);color:#cfe9dd}

/* ---------- partner ---------- */
.ptn{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.ptn .nm{font-size:.95rem;font-weight:700}
.ptn .sh{font-size:.73rem;color:var(--muted);margin-bottom:14px}
.ptn .big{font-size:1.45rem;font-weight:800;letter-spacing:-.035em}
.ptn .meter{height:11px;border-radius:7px;background:var(--grey-s);margin:13px 0 10px;overflow:hidden}
.ptn .meter i{display:block;height:11px;border-radius:7px;background:var(--mint)}
.ptn .meter i.low{background:var(--amber)}
.ptn .meter i.bad{background:var(--rose)}
.ptn .legs{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.ptn .legs b{display:block;color:var(--ink);font-size:.87rem;font-weight:800;margin-top:2px}

/* ---------- tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:420px}
th{text-align:right;font-weight:600;color:var(--muted);font-size:.73rem;padding:10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:left;direction:ltr}
th.mid{text-align:center}
td.mid{text-align:center}
td{padding:13px 10px;border-bottom:1px solid var(--line);color:var(--ink2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--mint-s)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left;direction:ltr;
  color:var(--ink);font-weight:700}
td.neg{color:var(--rose)}
.pill{display:inline-block;font-size:.69rem;padding:4px 11px;border-radius:999px;font-weight:700;
  background:var(--grey-s);color:var(--muted);white-space:nowrap}
.pill.p1{background:var(--rose-s);color:var(--rose)}
.pill.p2{background:var(--amber-s);color:var(--amber)}
.pill.p3{background:var(--mint-s2);color:var(--deep)}

.stamp{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;color:var(--ink2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  margin:0 0 18px 8px}
.stamp b{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.stamp.stale b{background:var(--amber)}
/* ---------- دانشنامه ---------- */
@keyframes kbUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.kb-card,.kb-hero,.kb-body{animation:none!important}}
.kb-hero{background:linear-gradient(135deg,var(--deep),#2a6d58);color:#fff;border-radius:20px;
  padding:24px 26px;margin-bottom:18px;animation:kbUp .34s cubic-bezier(.22,1,.36,1) both;
  position:relative;overflow:hidden}
.kb-hero::after{content:"";position:absolute;left:-40px;top:-40px;width:180px;height:180px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.kb-hero .ico{font-size:1.7rem;opacity:.9;margin-bottom:8px;display:block}
.kb-hero h3{font-size:1.3rem;font-weight:800;margin-bottom:5px}
.kb-hero p{font-size:.85rem;opacity:.82;max-width:52ch;line-height:1.75}
.kb-hero .meta{margin-top:13px;display:flex;gap:9px;flex-wrap:wrap;font-size:.72rem}
.kb-hero .meta span{background:rgba(255,255,255,.14);padding:4px 11px;border-radius:999px}
.kb-grid{display:grid;gap:13px}
.kb-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px 19px;
  text-align:right;width:100%;cursor:pointer;display:block;
  animation:kbUp .4s cubic-bezier(.22,1,.36,1) both;
  transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s,border-color .18s}
.kb-card:hover{transform:translateY(-3px);border-color:var(--mint);
  box-shadow:0 10px 26px -14px rgba(27,77,62,.42)}
.kb-card:active{transform:translateY(-1px)}
.kb-card .top{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.kb-card h4{font-size:.98rem;font-weight:800;line-height:1.5;flex:1;min-width:60%}
.kb-card p{font-size:.82rem;color:var(--muted);line-height:1.85}
.kb-card .foot{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:10px;font-size:.72rem;color:var(--ink2);flex-wrap:wrap}
.kb-tag{padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:800;white-space:nowrap}
.kb-tag.k-نرخ{background:var(--amber-s);color:var(--amber)}
.kb-tag.k-بخشنامه{background:rgba(27,77,62,.11);color:var(--deep)}
.kb-tag.k-خبر{background:var(--grey-s);color:var(--muted)}
.kb-tag.k-مقاله{background:var(--mint-s);color:var(--deep)}
.kb-pin{color:var(--amber);font-size:.8rem}
.kb-body{animation:kbUp .3s cubic-bezier(.22,1,.36,1) both;line-height:2.05;font-size:.9rem}
.kb-body h5{font-size:.95rem;font-weight:800;margin:18px 0 7px}
.kb-body p{margin-bottom:12px}
.kb-body ul{margin:0 18px 13px 0;padding:0}
.kb-body li{margin-bottom:7px;list-style:disc}
.kb-body table{width:100%;border-collapse:collapse;margin:6px 0 15px;font-size:.84rem}
.kb-body th{background:var(--grey-s);font-weight:800;padding:9px 11px;text-align:right;
  border-bottom:1px solid var(--line)}
.kb-body td{padding:9px 11px;border-bottom:1px solid var(--line)}
.kb-body b{font-weight:800;color:var(--ink)}
.kb-src{margin-top:18px;padding:13px 15px;background:var(--grey-s);border-radius:13px;
  font-size:.76rem;color:var(--ink2);line-height:1.95}
.kb-src a{color:var(--deep);font-weight:700;word-break:break-all}
.kb-stale{background:var(--amber-s);color:var(--amber);padding:11px 15px;border-radius:13px;
  font-size:.79rem;margin-bottom:15px;font-weight:600}
.crumb{display:flex;gap:7px;align-items:center;font-size:.81rem;margin:0 0 14px}
.crumb button{color:var(--deep);font-size:.81rem;font-weight:700}
.spin{color:var(--muted);font-size:.85rem;padding:52px 0;text-align:center}
.sub-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sub-nav button{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.sub-nav button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.fs tr.sec td{background:var(--mint-s);font-weight:800;color:var(--deep);font-size:.82rem}
.fs tr.tot td{border-top:2px solid var(--line);font-weight:800;color:var(--ink)}
.fs tr.sub td:first-child{padding-right:26px;color:var(--muted)}
.gap{background:var(--amber-s);color:var(--amber);border-radius:12px;padding:12px 14px;
  font-size:.82rem;margin-bottom:14px;line-height:1.7}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);
  padding:30px 20px;text-align:center;color:var(--muted);font-size:.85rem;line-height:1.8}
.chat{display:flex;flex-direction:column;gap:12px;min-height:50vh}
.bub{max-width:88%;padding:13px 15px;border-radius:16px;font-size:.86rem;line-height:1.75;
  white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-start;background:var(--deep);color:#fff;border-bottom-left-radius:5px}
.bub.ai{align-self:flex-end;background:var(--card);border:1px solid var(--line);
  border-bottom-right-radius:5px}
.bub.sys{align-self:center;background:var(--amber-s);color:var(--amber);font-size:.79rem;
  text-align:center;max-width:100%}
.bub table{min-width:0;font-size:.79rem;margin-top:8px}
.bub td,.bub th{padding:6px 8px}
.ask{position:sticky;bottom:0;background:var(--canvas);padding:12px 0 4px;
  display:flex;gap:9px;align-items:flex-end}
.ask textarea{flex:1;resize:none;min-height:46px;max-height:130px;padding:12px 14px;
  border:1px solid var(--line);border-radius:16px;background:var(--card);
  color:var(--ink);font-size:.88rem;line-height:1.6}
.ask button{background:var(--deep);color:#fff;border-radius:50%;width:46px;height:46px;
  flex:0 0 46px;font-size:1.05rem;display:grid;place-items:center}
.ask button:disabled{opacity:.45}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

<script>
var SUPABASE_URL = "https://zlzjzzqrkbsqornnimlx.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_SC84u5DIOQgSgNI43KE6NQ_wWGGTg69";
var db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var $ = function(id){ return document.getElementById(id); };

var BUILD = "۳۴";
var S = { role:"viewer", pages:[], widgets:[], core:{}, cash:null, health:{},
          insights:[], periods:[], page:"home", ready:false, booting:false, bootSrc:"", nowJalali:"", me:null, meName:"", fresh:{}, internals:false };

/* ---------- formatting ---------- */
function fa(n){ return Number(n).toLocaleString("fa-IR"); }

/* واحد نمایش اعداد: ریال کامل یا میلیارد — روی همین دستگاه به خاطر می‌ماند */
var MONEY = "rial";
try{ MONEY = localStorage.getItem("sayanik_money") || "rial"; }catch(e){}
function unitLabel(){ return MONEY==="rial" ? "ریال" : "میلیارد ریال"; }

/* عدد اصلی — از واحد انتخابی پیروی می‌کند */
function bn(n){ if(n===null||n===undefined||n==="") return "—";
  if(MONEY==="rial") return Math.round(Number(n)).toLocaleString("fa-IR");
  return (Number(n)/1e9).toLocaleString("fa-IR",{maximumFractionDigits:1}); }

/* عدد فشرده — فقط برای برچسب نمودارها که جا تنگ است؛ همیشه میلیارد */
function bnS(n){ if(n===null||n===undefined||n==="") return "—";
  return (Number(n)/1e9).toLocaleString("fa-IR",{maximumFractionDigits:1}); }
function pct(n){ return n===null||n===undefined?"—":fa(Math.round(n))+"٪"; }
function esc(s){ return String(s===null||s===undefined?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function prioCls(p){ if(!p) return ""; var c=String(p).trim().charAt(0);
  return (c==="\u06F1"||c==="1")?"p1":((c==="\u06F2"||c==="2")?"p2":"p3"); }

/* ---------- theme ---------- */
$("theme").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);
  $("theme").textContent = next==="dark" ? "☀" : "☾";
});

/* ---------- auth ---------- */
function anote(t,k){ var n=$("anote"); n.textContent=t; n.className="note "+k; }

$("go").addEventListener("click",async function(){
  var b=$("go"); b.disabled=true; b.textContent="در حال ورود…";
  /* ایمیل را کوچک می‌کنیم و فاصله‌های اضافی رمز را می‌گیریم — کیبورد موبایل هر دو را خراب می‌کند */
  var em=$("em").value.trim().toLowerCase();
  var pwv=$("pw").value.replace(/^\s+|\s+$/g,"")
                      .replace(/[‐-―−]/g,"-")   /* خط تیره‌های هوشمند */
                      .replace(/[‘’]/g,"'").replace(/[“”]/g,'"');
  var r=await db.auth.signInWithPassword({email:em,password:pwv});
  b.disabled=false; b.textContent="ورود";
  if(r.error){
    var m=String(r.error.message||"");
    anote(/Invalid login/i.test(m)   ? "ایمیل یا رمز عبور درست نیست."
        : /rate limit|too many/i.test(m) ? "تلاش‌های ورود زیاد بوده؛ چند دقیقه صبر کنید."
        : /not confirmed/i.test(m)   ? "این ایمیل هنوز تأیید نشده است."
        : /network|fetch|load failed/i.test(m) ? "به سرور وصل نشد — اینترنت را بررسی کنید."
        : "ورود ناموفق — "+m, "err");
    return;
  }
  /* ایمیلِ موفق را روی همین دستگاه به یاد می‌سپاریم — فقط ایمیل، هرگز رمز */
  try{ localStorage.setItem("sayanik_email", em); }catch(e){}
  start();
});

/* کادر ایمیل فقط وقتی از پیش پر می‌شود که روی همین دستگاه قبلاً وارد شده باشند.
   روی دستگاه تازه خالی می‌ماند — هیچ ایمیلی در خود فایل نوشته نشده است. */
(function(){
  try{
    var last=localStorage.getItem("sayanik_email");
    if(last){ $("em").value=last;
      setTimeout(function(){ try{ $("pw").focus(); }catch(e){} },120); }
    else { setTimeout(function(){ try{ $("em").focus(); }catch(e){} },120); }
  }catch(e){}
})();
$("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") $("go").click(); });
$("forgot").addEventListener("click",async function(){
  var em=$("em").value.trim();
  if(!em){ anote("اول ایمیل خود را وارد کنید.","err"); return; }
  var r=await db.auth.resetPasswordForEmail(em,{redirectTo:location.href});
  anote(r.error?"ارسال ایمیل ناموفق بود.":"لینک بازنشانی رمز ایمیل شد.", r.error?"err":"ok");
});
$("logout").addEventListener("click",async function(){
  try{ sessionStorage.removeItem("sayanik_page"); localStorage.removeItem("sayanik_page"); }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  await db.auth.signOut(); location.reload();
});

function fromLink(){ var h=location.hash||"";
  return h.indexOf("type=invite")>-1||h.indexOf("type=recovery")>-1||h.indexOf("type=signup")>-1; }
function showSetPw(ses,cancel){
  $("auth").classList.add("hide"); $("app").classList.add("hide");
  $("setpw").classList.remove("hide");
  $("cancelpw").classList.toggle("hide",!cancel);
  if(ses&&ses.user) $("pwwho").textContent=ses.user.email;
}
$("chpw").addEventListener("click",async function(){
  var s=await db.auth.getSession(); showSetPw(s.data.session,true); closeSide();
});
$("cancelpw").addEventListener("click",function(){
  $("setpw").classList.add("hide"); $("app").classList.remove("hide"); });
$("savepw").addEventListener("click",async function(){
  var a=$("np").value,b2=$("np2").value,n=$("pnote");
  if(a.length<8){ n.textContent="رمز باید حداقل ۸ کاراکتر باشد."; n.className="note err"; return; }
  if(a!==b2){ n.textContent="دو رمز یکسان نیستند."; n.className="note err"; return; }
  var btn=$("savepw"); btn.disabled=true; btn.textContent="در حال ذخیره…";
  var r=await db.auth.updateUser({password:a});
  btn.disabled=false; btn.textContent="ذخیره";
  if(r.error){ n.textContent="ذخیره نشد: "+r.error.message; n.className="note err"; return; }
  history.replaceState(null,"",location.pathname);
  $("np").value=""; $("np2").value=""; n.className="note";
  $("setpw").classList.add("hide");
  if(S.ready){ $("app").classList.remove("hide"); } else { start(); }
});

/* ---------- sidebar ---------- */
function openSide(){ $("side").classList.add("open");
  var s=document.createElement("div"); s.className="scrim"; s.id="scrim";
  s.addEventListener("click",closeSide); document.body.appendChild(s); }
function closeSide(){ $("side").classList.remove("open");
  var s=$("scrim"); if(s) s.remove(); }
$("burger").addEventListener("click",openSide);

/* جابجایی واحد: ریال کامل ↔ میلیارد ریال */
function applyMoneyMode(){
  document.body.classList.toggle("rial", MONEY==="rial");
  var b=$("unitBtn");
  if(b){ b.textContent = MONEY==="rial" ? "ر" : "م";
         b.title = MONEY==="rial" ? "واحد: ریال — برای میلیارد بزنید"
                                  : "واحد: میلیارد ریال — برای ریال بزنید"; }
}
applyMoneyMode();
$("unitBtn").addEventListener("click",function(){
  MONEY = (MONEY==="rial") ? "bn" : "rial";
  try{ localStorage.setItem("sayanik_money", MONEY); }catch(e){}
  applyMoneyMode();
  if(S.ready){ stamp(); go(S.page||"home"); }
});

/* به‌روزرسانی دستی داده‌ها — صفحهٔ جاری حفظ می‌شود */
$("reload").addEventListener("click",async function(){
  var b=$("reload"); b.disabled=true; b.textContent="…";
  try{ await start(true); } finally { b.disabled=false; b.textContent="⟳"; }
});

/* بعد از غیبت طولانی داده‌ها کهنه می‌شود؛ فقط آن وقت دوباره می‌خوانیم */
var hiddenAt=0;
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(S.ready && hiddenAt && Date.now()-hiddenAt > 900000) start(true);
  hiddenAt=0;
});

$("brandHome").addEventListener("click",function(){
  if(S.page!=="home") go("home");
  closeSide();
});

/* ---------- boot ---------- */
async function start(force){
  /* اگر داشبورد همین حالا بالا و سالم است، دوباره از صفر ساخته نشود */
  if(S.booting) return;
  if(S.ready && !force) return;
  S.booting=true;
  try{
    var s=await db.auth.getSession();
    if(!s.data.session){ S.ready=false;
      $("auth").classList.remove("hide"); $("app").classList.add("hide"); return; }
    if(fromLink()){ showSetPw(s.data.session,false); return; }
    $("auth").classList.add("hide"); $("setpw").classList.add("hide");
    $("app").classList.remove("hide");
    await boot(s.data.session);
    S.ready=true;
    startPresence();
  } finally { S.booting=false; }
}

async function boot(ses){
  var q=await Promise.all([
    db.from("profiles").select("full_name,email,role,sees_internals").eq("id",ses.user.id).single(),
    db.from("dash_pages").select("*").eq("is_active",true).order("sort_order"),
    db.from("dash_widgets").select("*").eq("is_active",true).order("sort_order"),
    db.from("v_kpi_core").select("*").single(),
    db.from("v_kpi_cash").select("cash_total").single(),
    db.from("v_data_health").select("*").maybeSingle(),
    db.from("v_data_freshness").select("*").maybeSingle(),
    db.from("v_health_score").select("*").single(),
    db.from("v_insights").select("*").order("ord"),
    db.from("v_period_totals").select("*").order("sort_order")
  ]);

/* صفحه‌ای که کاربر آخر بار باز کرده بود — تا با برگشت از تب دیگر به صفحه اصلی نپرد */
function startPage(){
  var k="", src="آدرس";
  try{ k=decodeURIComponent((location.hash||"").replace(/^#/,"")); }catch(e){ k=""; }
  if(k.indexOf("=")>-1||k.indexOf("&")>-1) k="";
  if(!k){ src="حافظهٔ تب"; try{ k=sessionStorage.getItem("sayanik_page")||""; }catch(e){ src="حافظه قفل"; } }
  if(!k){ src="حافظهٔ دستگاه"; try{ k=localStorage.getItem("sayanik_page")||""; }catch(e){ src="حافظه قفل"; } }
  if(!k) src="چیزی ذخیره نشده";
  var ok=false;
  for(var i=0;i<S.pages.length;i++){ if(S.pages[i].key===k){ ok=true; break; } }
  if(k && !ok) src="کلید ناشناس: "+k;
  S.bootSrc = ok ? src : (k?src:"چیزی ذخیره نشده");
  return ok ? k : "home";
}

function stamp(){
  var d=(S.fresh&&(S.fresh.last_data_change||S.fresh.last_sync))
        ||S.dataHealth.last_data_change||S.dataHealth.last_sync;
  if(!d){ $("stamp").innerHTML=""; return; }
  var days=Math.floor((Date.now()-new Date(d).getTime())/86400000);
  $("stamp").innerHTML='<span class="stamp'+(days>14?" stale":"")+'"><b></b>داده تا '+
    esc(new Date(d).toLocaleDateString("fa-IR"))+' — '+(days<=0?"امروز":fa(days)+" روز پیش")+'</span>'+
    '<span class="stamp" style="margin-right:8px">نسخه '+BUILD+
      (S.bootSrc?' · '+esc(S.bootSrc):"")+'</span>';

  });

  else if(key==="kb")         h = await kbIndex();
  else if(key.indexOf("kb-")===0) h = await kbTopic(key);
  else if(key==="agent")      h = await agentPage();
  else if(key==="statements") h = await statementsPage();
  else if(key==="cashflow")   h = await cashflowPage();
  else if(key==="income")     h = await incomePage();
  else if(key==="balance")    h = await balancePage();
  else                        h = await sub(key);

function rowsTable(kind,rows,sumKey){
  var cols=DCOLS[kind]||DCOLS.cmt;
  var tot=rows.reduce(function(a,x){ return a+Number(x[sumKey]||0); },0);
  var h='<div class="scroll"><table><thead><tr>';
  cols.forEach(function(c){ h+='<th class="'+(c.n?"num":(c.pill?"mid":""))+'">'+esc(c.t)+"</th>"; });
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    h+="<tr>";
    cols.forEach(function(c){
      var v=r[c.k];
      if(c.n) h+='<td class="num'+(Number(v)<0?" neg":"")+'">'+bn(v)+"</td>";
      else if(c.pill) h+='<td class="mid"><span class="pill '+prioCls(v)+'">'+
        esc(String(v||"—").replace(/\s*-\s*.*/,""))+"</span></td>";
      else h+="<td>"+esc((v===null||v===undefined||v==="")?"—":v)+"</td>";
    });
    h+="</tr>";
  });
  h+='<tr style="font-weight:800"><td colspan="'+(cols.length-1)+'">جمع '+fa(rows.length)+' ردیف</td>'+
     '<td class="num">'+bn(tot)+'</td></tr>';
  return h+"</tbody></table></div>";
}

function kpiCard(w){
  var c=w.cfg||{}, ctx={}; for(var k in S.core) ctx[k]=S.core[k];
  ctx.cash = S.cash===null?0:S.cash;
  var val;
  if(c.expr){ val=0; var sg=1;
    String(c.expr).split(/\s+/).forEach(function(t){
      if(t==="+") sg=1; else if(t==="-") sg=-1; else if(t) val+=sg*Number(ctx[t]||0); });
  } else { val = (w.source==="v_kpi_cash") ? S.cash : ctx[c.field]; }
  if(val===null||val===undefined) return "";

  var cls = c.tone==="signed" ? (val<0?"neg":"pos")
          : (c.tone==="neg" ? "neg" : (c.tone==="warn" ? "warn" : ""));
  var shown=(c.tone==="signed"?(val<0?"−":"+"):"")+bn(Math.abs(val));

  var delta={tag:"",note:"&nbsp;"};
  if(c.field==="firm_open"){
    delta.note=fa(S.core.open_commitment_count||0)+' تعهد باز';
  } else if(c.field==="due_next_3m"){
    delta.note='مهر تا آذر ۱۴۰۵';
  } else if(c.field==="project_cost"){
    delta.note='بدون کالای بازرگانی و قرض بین‌شرکتی';
  } else if(c.field==="inflow_certain"){
    delta.note='علامت‌خورده «قطعی» در شیت';

async function outlookCard(){
  var r=await db.from("v_monthly_outlook").select("*").order("month_code").limit(6);
  var rows=r.data||[]; if(!rows.length) return "";
  var bal=(S.cash||0), pts=[], labs=[];
  rows.forEach(function(x){ bal+=Number(x.inflow_certain)-Number(x.firm_due);
    pts.push(bal/1e9); labs.push(String(x.month_name).replace(" 1405","")); });
  var max=Math.max.apply(null,pts.concat([0]))*1.15||1;
  var min=Math.min.apply(null,pts.concat([0]))*1.15;
  var W=520,H=190,pad=24;
  function X(i){ return pad+ i*(W-pad*2)/Math.max(1,pts.length-1); }
  function Y(v){ return H-pad-((v-min)/(max-min||1))*(H-pad*2); }
  var d=pts.map(function(v,i){ return (i?"L":"M")+X(i)+" "+Y(v); }).join(" ");
  var area=d+" L"+X(pts.length-1)+" "+Y(min)+" L"+X(0)+" "+Y(min)+" Z";

  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+
    '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--mint)" stop-opacity=".30"/>'+
    '<stop offset="100%" stop-color="var(--mint)" stop-opacity="0"/></linearGradient></defs>';
  if(min<0) s+='<line x1="'+pad+'" y1="'+Y(0)+'" x2="'+(W-pad)+'" y2="'+Y(0)+
    '" stroke="var(--rose)" stroke-width="1" stroke-dasharray="4 4"/>';
  s+='<path d="'+area+'" fill="url(#g1)"/>';
  s+='<path d="'+d+'" fill="none" stroke="var(--mint)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(v,i){
    s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4" fill="var(--card)" stroke="var(--mint)" stroke-width="2.5"/>';
    s+='<text x="'+X(i)+'" y="'+(Y(v)-11)+'" text-anchor="middle" font-size="10.5" font-weight="700"'+

    s+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10"'+

function bars(w,c,rows){
  var max=0; rows.forEach(function(r){ max=Math.max(max,Math.abs(Number(r[c.value]||0))); });
  if(!max) max=1;
  var tot=rows.reduce(function(a,r){ return a+Number(r[c.value]||0); },0);
  var two=!!(c.value2 && rows.some(function(r){ return Number(r[c.value2]||0)>0; }));
  var more='<button class="more" data-full="'+esc(w.source)+'|'+esc(c.label)+'|'+
           esc(c.value)+'|'+esc(w.title)+'">مشاهده کامل ←</button>';
  var h='<div class="card" style="margin-bottom:14px"><div class="chead"><div><h3>'+
        esc(w.title)+'</h3><p class="hint">'+fa(rows.length)+' گروه · جمع '+bn(tot)+
        ' '+unitLabel()+'</p></div>'+more+'</div>';
  if(two) h+='<div style="display:flex;gap:14px;margin:0 2px 12px;font-size:.73rem;color:var(--muted)">'+
    '<span style="display:flex;align-items:center;gap:6px">'+
      '<i style="width:11px;height:11px;border-radius:3px;background:var(--mint);display:inline-block"></i>'+
      esc(c.lab1||"قطعی")+'</span>'+
    '<span style="display:flex;align-items:center;gap:6px">'+
      '<i style="width:11px;height:11px;border-radius:3px;background:var(--amber);display:inline-block"></i>'+
      esc(c.lab2||"محتمل")+'</span></div>';
  rows.forEach(function(r){
    var v=Number(r[c.value]||0), pw=Math.max(2,Math.round(Math.abs(v)/max*100));
    var cnt=(r.line_count===undefined||r.line_count===null)?"":
            '<span class="cnt">'+fa(r.line_count)+'</span>';
    var inner;
    if(two){
      var a=Number(r[c.value2]||0), b=Math.max(0,Math.abs(v)-Math.abs(a));
      var pa=Math.abs(v)?Math.round(Math.abs(a)/Math.abs(v)*100):0;
      inner='<span class="fill" style="width:'+pw+'%;display:flex">'+
            '<i style="width:'+(100-pa)+'%;background:var(--mint)"></i>'+
            '<i style="width:'+pa+'%;background:var(--amber)"></i></span>';
      void b;
    } else {
      inner='<span class="fill'+(c.flag&&r[c.flag]?" alt":"")+'" style="width:'+pw+'%"></span>';
    }
    h+='<div class="brow"><span class="nm">'+esc(r[c.label])+cnt+'</span>'+
       '<span class="track">'+inner+'</span><span class="vl">'+bn(v)+'</span></div>';
  });
  return h+'</div>';
}

   بدون این، دو نفر می‌توانند هم‌زمان دو عدد متفاوت روی صفحه داشته باشند. */
var staleShown = "";
async function checkStale(){
  try{
    var r = await db.from("v_data_freshness").select("*").maybeSingle();
    if(r.error || !r.data) return;
    var srv  = r.data.last_data_change || r.data.last_sync;
    var mine = (S.fresh && (S.fresh.last_data_change || S.fresh.last_sync)) || null;
    if(!srv || !mine) return;
    if(new Date(srv) > new Date(mine) && staleShown !== srv){
      staleShown = srv;
      strip("داده‌ها از زمانی که این صفحه باز شده تازه‌تر شده‌اند.", "به‌روزرسانی",
            function(){ start(true); }, true);
    }
  }catch(e){}
}

/* متن ساده را به HTML تبدیل می‌کند: ** پررنگ **، • فهرست، | جدول | */
function kbText(src){
  var lines=String(src||"").split("\n"), out="", list=null, tbl=null;
  function closeList(){ if(list){ out+="<ul>"+list.join("")+"</ul>"; list=null; } }
  function closeTbl(){
    if(tbl){
      var h="<table><thead><tr>"+tbl[0].map(function(c){return "<th>"+c+"</th>";}).join("")+
            "</tr></thead><tbody>";
      for(var i=1;i<tbl.length;i++)
        h+="<tr>"+tbl[i].map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>";
      out+=h+"</tbody></table>"; tbl=null;
    }
  }
  function inline(t){
    return esc(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  }
  lines.forEach(function(raw){
    var t=raw.trim();
    if(!t){ closeList(); closeTbl(); return; }
    if(t.charAt(0)==="|" && t.charAt(t.length-1)==="|"){
      var cells=t.slice(1,-1).split("|").map(function(c){ return inline(c.trim()); });
      if(cells.join("").replace(/[-\s]/g,"")==="") return;   /* خط جداکنندهٔ جدول */
      closeList(); if(!tbl) tbl=[]; tbl.push(cells); return;
    }
    closeTbl();
    if(t.charAt(0)==="•"){ if(!list) list=[]; list.push("<li>"+inline(t.slice(1).trim())+"</li>"); return; }
    closeList();
    if(/^\*\*[^*]+\*\*$/.test(t)){ out+="<h5>"+inline(t).replace(/<\/?b>/g,"")+"</h5>"; return; }
    out+="<p>"+inline(t)+"</p>";
  });
  closeList(); closeTbl();
  return out;
}

/* ارقام فارسی و عربی را به لاتین برمی‌گرداند تا مقایسهٔ تاریخ درست باشد */
function lat(s){
  return String(s===null||s===undefined?"":s).replace(/[۰-۹٠-٩]/g,function(d){
    var i="۰۱۲۳۴۵۶۷۸۹".indexOf(d);
    if(i<0) i="٠١٢٣٤٥٦٧٨٩".indexOf(d);
    return i<0 ? d : String(i);
  });
}

/* آیا تاریخ بازبینی گذشته است؟ مقایسهٔ YYYY/MM روی ارقام لاتین */
function kbStale(a){
  if(!a.review_jalali || !S.nowJalali) return false;

function table(w,c,rows){
  var cols=c.columns||[];
  var h='<div class="card" style="margin-bottom:14px"><h3>'+esc(w.title)+'</h3><p class="hint"></p>';
  if(c.search) h+='<input id="srch" class="srch" placeholder="جست‌وجو در شرح، دسته یا طرف حساب…">';
  h+='<div class="scroll"><table><thead><tr>';
  cols.forEach(function(x){ h+='<th class="'+(x.n?"num":(x.pill?"mid":""))+'">'+esc(x.t)+"</th>"; });
  h+='</tr></thead><tbody'+(c.search?' id="rowsbody"':"")+">";
  var bal=(c.running==="cash")?(S.cash||0):null;
  rows.forEach(function(r){
    if(bal!==null) bal+=Number(r.inflow_certain||0)-Number(r.firm_due||0);
    var k=((r.description||"")+" "+(r.category||"")+" "+(r.counterparty||"")).toLowerCase();
    h+='<tr data-k="'+esc(k)+'">';
    cols.forEach(function(x){
      var v=(x.k==="__balance")?bal:r[x.k];
      if(x.n) h+='<td class="num'+(Number(v)<0?" neg":"")+'">'+bn(v)+"</td>";
      else if(x.pill) h+='<td class="mid"><span class="pill '+prioCls(v)+'">'+
        esc(String(v||"—").replace(/\s*-\s*.*/,""))+"</span></td>";
      else h+="<td>"+esc((v===null||v===undefined||v==="")?"—":v)+"</td>";
    });
    h+="</tr>";
  });
  return h+"</tbody></table></div></div>";
}

async function cashflowPage(){
  var q = await Promise.all([
    db.from("v_cashflow_statement").select("*"),
    db.from("v_cashflow_summary").select("*").order("sort_order"),
    db.from("v_kpi_cash").select("cash_total").single()
  ]);
  var rows=q[0].data||[], sum=q[1].data||[], cash=q[2].data?Number(q[2].data.cash_total):null;
  if(!rows.length) return subNav("cashflow")+'<div class="empty">داده‌ای برای نمایش نیست.</div>';

  // جمع هر قلم در همه دوره‌ها
  var byLine={};
  rows.forEach(function(r){
    var k=r.section+"|"+r.line_item;
    if(!byLine[k]) byLine[k]={sec:r.section,lab:r.section_label,so:r.sort_order,
                              item:r.line_item,v:0,n:0};
    byLine[k].v+=Number(r.net_rial); byLine[k].n+=Number(r.line_count);
  });
  var items=Object.keys(byLine).map(function(k){return byLine[k];});
  var order={operating:1,investing:2,financing:3};
  items.sort(function(a,b){ return (order[a.sec]-order[b.sec]) || (a.so-b.so); });

  var net=sum.reduce(function(a,x){ return a+Number(x.net_rial); },0);

  var h=subNav("cashflow");
  h+='<div class="grid g3" style="margin-bottom:14px">';
  sum.forEach(function(x){
    var v=Number(x.net_rial);
    h+='<div class="kpi '+(v<0?"neg":"pos")+'"><div class="bd">'+
       '<div class="hd"><span class="lab">'+esc(x.section_label)+'</span>'+
       '<span class="chip">'+(v<0?"↓":"↑")+'</span></div>'+
       '<div class="val">'+(v<0?"−":"+")+bn(Math.abs(v))+
       '<span class="unit">'+unitLabel()+'</span></div></div>'+
       '<div class="ft"><span>خالص دوره‌های ثبت‌شده</span><span></span></div></div>';
  });
  h+='</div>';

  h+='<div class="card"><div class="chead"><div><h3>صورت جریان وجوه نقد</h3>'+
     '<p class="hint">همه دوره‌ها، تجمعی — '+unitLabel()+'</p></div></div>'+
     '<div class="scroll"><table class="fs"><thead><tr><th>شرح</th>'+
     '<th class="num">تعداد قلم</th><th class="num">خالص</th></tr></thead><tbody>';

  var cur=null;
  items.forEach(function(it){
    if(it.sec!==cur){
      cur=it.sec;
      var secTot=sum.filter(function(x){return x.section===it.sec;})[0];
      h+='<tr class="sec"><td>'+esc(it.lab)+'</td><td></td><td class="num">'+
         (secTot?bn(secTot.net_rial):"—")+'</td></tr>';
    }
    h+='<tr class="sub"><td>'+esc(it.item)+'</td><td class="num">'+fa(it.n)+'</td>'+
       '<td class="num'+(it.v<0?" neg":"")+'">'+bn(it.v)+'</td></tr>';
  });

  h+='<tr class="tot"><td>خالص تغییر وجه نقد</td><td></td>'+
     '<td class="num'+(net<0?" neg":"")+'">'+bn(net)+'</td></tr>';
  if(cash!==null){
    h+='<tr class="tot"><td>موجودی نقدی فعلی</td><td></td><td class="num">'+bn(cash)+'</td></tr>';
  }
  h+='</tbody></table></div></div>';

  h+='<p class="hint" style="margin-top:12px">هر قلم با علامت خودش آمده: ورودی مثبت، خروجی منفی. '+
     'قرض بین‌شرکتی در بخش تأمین مالی است و چون رفت و برگشت شده، خالصش نزدیک صفر است.</p>';
  return h;
}

    if(k==='commitments') q=q.order('remaining_rial',{ascending:false}).limit(60);
    var r=await q;
    out[k]=r.error?{error:r.error.message}:r.data;
  }));
  return out;
}

function chatPush(role, text){
  CHAT.push({role:role, text:text});
  var box=$("chatbox"); if(!box) return;
  var d=document.createElement("div");
  d.className="bub "+(role==="user"?"me":(role==="sys"?"sys":"ai"));
  d.textContent=text;
  box.appendChild(d);
  d.scrollIntoView({block:"end",behavior:"smooth"});
  return d;
}

function bindAgent(){
  var send=$("send"), box=$("qbox");
  if(!send) return;

  function go(){
    var t=(box.value||"").trim();
    if(!t) return;
    box.value=""; box.style.height="auto";
    answer(t);
  }
  send.addEventListener("click",go);
  box.addEventListener("input",function(){
    box.style.height="auto"; box.style.height=Math.min(box.scrollHeight,130)+"px";
  });
  box.addEventListener("keydown",function(e){
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); go(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-q]"),function(b){
    b.addEventListener("click",function(){ answer(b.getAttribute("data-q")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-approve],[data-reject]"),function(b){
    b.addEventListener("click",async function(){
      var id=b.getAttribute("data-approve")||b.getAttribute("data-reject");
      var ok=!!b.getAttribute("data-approve");
      b.disabled=true; b.textContent="…";
      var r=await db.rpc('agent_decide',{p_id:id,p_approve:ok});
      go_reload();
    });
  });
}
function go_reload(){ go("agent"); }

/* ---- پاسخ‌دهی ---- */
async function answer(q){
  chatPush("user", q);
  var thinking = chatPush("ai", "در حال بررسی داده‌ها…");
  var send=$("send"); if(send) send.disabled=true;

  try{
    var ses = await db.auth.getSession();
    var jwt = ses.data.session ? ses.data.session.access_token : null;
    if(!jwt){ thinking.textContent="نشست شما منقضی شده. دوباره وارد شوید."; return; }

    var r = await fetch(SUPABASE_URL + "/functions/v1/ask", {
      method:"POST",
      headers:{ "Content-Type":"application/json",
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + jwt },
      body: JSON.stringify({ question:q, history: CHAT.slice(-6) })
    });

    var txt = await r.text();
    var j; try{ j=JSON.parse(txt); }catch(e){ j=null; }

    if(!r.ok || !j || !j.ok){
      var m = (j && j.message) ? j.message : ("خطای "+r.status);
      if(r.status===404){
        m = "تابع تحلیلگر هنوز روی Supabase منتشر نشده است.";
      }
      thinking.textContent = m;
      return;
    }

    thinking.textContent = j.answer || "پاسخی دریافت نشد.";
    CHAT[CHAT.length-1].text = thinking.textContent;

    if(j.sources && j.sources.length){
      var s2=document.createElement("div");
      s2.className="bub sys";
      s2.textContent="بر پایه: "+j.sources.join(" · ");
      $("chatbox").appendChild(s2);
      s2.scrollIntoView({block:"end",behavior:"smooth"});
    }
  }catch(err){
    thinking.textContent = "ارتباط برقرار نشد: "+String(err).slice(0,200);
  }finally{
    if(send) send.disabled=false;
  }
}

/* کدام منبع داده به این سؤال می‌خورد */
function guessSources(q){
  var k=[], t=q;
  if(/وضعیت|خلاصه|کلی|سلامت/.test(t))              k.push('overview','health','insights');
  if(/کسری|تأمین|تامین|پول|نقدینگی/.test(t))        k.push('overview','outlook','cash');
  if(/شریک|شرکا|آورده|صادقیان|پترو|سرمایه/.test(t)) k.push('partners','funding');
  if(/ماه|پیش.?بینی|آینده|فشار/.test(t))            k.push('outlook','aging');
  if(/تعهد|بدهی|قرارداد|سررسید/.test(t))            k.push('commitments','aging','parties');
  if(/هزینه|مخارج|خرج|دسته/.test(t))                k.push('spend','subspend');
  if(/پیمانکار|طرف حساب/.test(t))                   k.push('parties');
  if(/تراکنش|جستجو|جست.?وجو/.test(t))               k.push('rows');
  if(/داده|کیفیت|تازگی/.test(t))                    k.push('quality');
  if(!k.length) k=['overview','insights'];
  return k.filter(function(x,i,a){return a.indexOf(x)===i;}).slice(0,4);
}

function renderData(data){
  var h="";
  for(var k in data){
    var rows=data[k];
    if(!rows || rows.error || !rows.length) continue;
    h+='<div style="margin-top:12px"><b>'+esc(SOURCES[k].t)+'</b>';
    h+='<div class="scroll"><table><tbody>';
    rows.slice(0,12).forEach(function(r){
      var cells=Object.keys(r).filter(function(c){
        return !/^id$|_id$|sort_order|day_code/.test(c);
      }).slice(0,4);
      h+='<tr>'+cells.map(function(c){
        var v=r[c];
        if(typeof v==='number' && Math.abs(v)>1e6) v=bn(v);
        else if(typeof v==='number') v=fa(v);
        return '<td>'+esc(v===null?'—':v)+'</td>';
      }).join('')+'</tr>';
    });
    h+='</tbody></table></div></div>';
  }
  return h;
}

/* ---------- نصب روی صفحه اصلی و به‌روزرسانی خودکار ---------- */
function strip(msg, btnText, onClick, warn){
  var old=document.getElementById("strip"); if(old) old.remove();
  var d=document.createElement("div");
  d.className="strip"+(warn?" warn":""); d.id="strip";
  d.innerHTML='<span>'+esc(msg)+'</span>';
  if(btnText){
    var b=document.createElement("button"); b.textContent=btnText;
    b.addEventListener("click",onClick); d.appendChild(b);
  } else {
    var x=document.createElement("button"); x.textContent="باشه";
    x.addEventListener("click",function(){ d.remove(); }); d.appendChild(x);
  }
  document.body.appendChild(d);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      // نسخه تازه آماده شد
      reg.addEventListener("updatefound", function(){
        var nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", function(){
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            strip("نسخه تازه داشبورد آماده است.", "به‌روزرسانی", function(){
              nw.postMessage("skipWaiting"); location.reload();
            });
          }
        });
      });
      // هر بار که اپ باز می‌شود، دنبال نسخه تازه بگرد
      reg.update();
    }).catch(function(){});
  });
  // وقتی worker عوض شد، یک بار رفرش کن
  var reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(reloaded) return; reloaded=true; location.reload();
  });
}
