# نمونهٔ پیکربندی nginx برای سرور داخلی
# dash.saya.local  ← فایل‌های همین مخزن (سایت ایستا)
# api.saya.local   ← Supabase خودمیزبان (Kong روی پورت 8000)
# گواهی TLS از CA داخلی شرکت؛ بدون HTTPS، سرویس‌ورکر و ورود امن کار نمی‌کند.

server {
  listen 443 ssl http2;
  server_name dash.saya.local;
  ssl_certificate     /etc/ssl/saya/dash.crt;
  ssl_certificate_key /etc/ssl/saya/dash.key;
  root /srv/saya-dashboard;          # محتوای مخزن sanico-dashboard
  index index.html;
  location = /sw.js       { add_header Cache-Control "no-cache"; }
  location = /version.txt { add_header Cache-Control "no-cache"; }
  location ~* \.(woff2|png|svg)$ { add_header Cache-Control "public, max-age=2592000"; }
  location / { try_files $uri $uri/ =404; }
  # فایل‌های داخلی مخزن نباید سرو شوند
  location ~ ^/(tools|deploy|supabase|backup|\.git)/ { deny all; }
}

server {
  listen 443 ssl http2;
  server_name api.saya.local;
  ssl_certificate     /etc/ssl/saya/api.crt;
  ssl_certificate_key /etc/ssl/saya/api.key;
  client_max_body_size 50m;
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # realtime
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
