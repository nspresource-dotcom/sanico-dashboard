<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>کارخانه پودر باریت سایا — داشبورد تصمیم</title>
<meta name="theme-color" content="#1b4d3e">
<link rel="icon" href="../IMG_9351.png">
<link rel="apple-touch-icon" href="../IMG_9351.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
@font-face{font-family:'Vazirmatn';src:url('../karnama/vazirmatn.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --canvas:#f2f5f3; --card:#ffffff; --rail:#ffffff;
  --ink:#16302a; --ink2:#50635c; --muted:#8c9a95; --line:#e8edea;
  --deep:#1b4d3e; --deep2:#2a6b56;
  --mint:#54cf96; --mint2:#86e0b7; --mint-s:#e7f5ec; --mint-s2:#d5ecdf;
  --amber:#b4791f; --amber-s:#fbf0da; --rose:#c43a3f; --rose-s:#fbe6e6;
  --grey-s:#eef1ef;
  --blue:#2563a8; --blue-s:#e6eef9;
  --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(22,48,42,.04), 0 10px 26px rgba(22,48,42,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0d1411; --card:#141d19; --rail:#111a16;
  --ink:#e8f1ec; --ink2:#b2c3bb; --muted:#7d8e87; --line:#20302a;
  --deep:#3fae86; --deep2:#58c79c;
  --mint:#54cf96; --mint2:#2f8f68; --mint-s:#17291f; --mint-s2:#1d3528;
  --amber:#e0a954; --amber-s:#2c2415; --rose:#e87b7f; --rose-s:#2d1a1b;
  --grey-s:#1a2621; --blue:#6aa9e4; --blue-s:#132234; --sh:none;
}}
:root[data-theme="dark"]{
  --canvas:#0d1411; --card:#141d19; --rail:#111a16;
  --ink:#e8f1ec; --ink2:#b2c3bb; --muted:#7d8e87; --line:#20302a;
  --deep:#3fae86; --deep2:#58c79c;
  --mint:#54cf96; --mint2:#2f8f68; --mint-s:#17291f; --mint-s2:#1d3528;
  --amber:#e0a954; --amber-s:#2c2415; --rose:#e87b7f; --rose-s:#2d1a1b;
  --grey-s:#1a2621; --blue:#6aa9e4; --blue-s:#132234; --sh:none;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.6;
  /* فونت‌های نصب‌شده روی خود دستگاه اول امتحان می‌شوند تا متن بدون
     هیچ درخواست اینترنتی نمایش داده شود؛ نسخه وبی فقط پشتیبان است. */
  font-family:'Vazirmatn','Vazir','IRANSans','IRANYekan','Sahel',
              system-ui,-apple-system,'Segoe UI','Noto Naskh Arabic',Tahoma,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
.hide{display:none!important}

/* ---------- auth ---------- */
.auth{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.authbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
  border-radius:24px;padding:30px 26px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--deep);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem;letter-spacing:-.02em}
.authbox h1{font-size:1.1rem;margin:0;font-weight:700}
.authbox .sub{color:var(--muted);font-size:.82rem;margin:0 0 18px}
label{display:block;font-size:.78rem;color:var(--ink2);margin:14px 0 6px;font-weight:500}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--canvas);color:var(--ink);font-size:.92rem}
input:focus{outline:2px solid var(--mint);outline-offset:1px}
.btn{width:100%;padding:13px;border-radius:var(--r-sm);background:var(--deep);color:#fff;
  font-weight:700;font-size:.93rem;margin-top:20px}
.btn:disabled{opacity:.5}
.btn-ghost{width:100%;color:var(--muted);font-size:.79rem;padding:12px 0 0;text-decoration:underline}
.note{margin-top:14px;font-size:.82rem;padding:10px 12px;border-radius:var(--r-sm);display:none}
.note.err{display:block;color:var(--rose);background:var(--rose-s)}
.note.ok{display:block;color:var(--deep);background:var(--mint-s)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;background:var(--canvas)}
.side{width:244px;flex:0 0 244px;background:var(--rail);padding:22px 16px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
  border-left:1px solid var(--line)}
.side .brand{margin:0 6px 24px;width:calc(100% - 12px);background:none;border:0;padding:4px 2px;cursor:pointer;font:inherit;color:inherit;text-align:right;border-radius:12px;transition:background .15s}
.side .brand:hover{background:rgba(27,77,62,.07)}
.side .brand h1{font-size:1.02rem;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  color:var(--ink2);font-size:.87rem;width:100%;text-align:right;transition:background .15s,color .15s}
.nav:hover{background:var(--grey-s)}
.nav.on{background:var(--deep);color:#fff;font-weight:700}
.nav .ic{width:19px;height:19px;flex:0 0 19px;display:grid;place-items:center;font-size:.95rem}
.nav.parent{justify-content:space-between}
.nav .caret{font-size:.7rem;color:var(--muted);transition:transform .18s}
.nav.open .caret{transform:rotate(-90deg)}
.kids{overflow:hidden;max-height:0;transition:max-height .22s ease}
.kids.open{max-height:260px}
.kids button{display:block;width:100%;text-align:right;padding:10px 14px 10px 40px;
  border-radius:12px;font-size:.81rem;color:var(--ink2)}
.kids button:hover{background:var(--grey-s)}
.kids button.on{background:var(--mint-s);color:var(--deep);font-weight:700}
.side .promo{margin-top:auto;background:linear-gradient(160deg,var(--mint-s2),var(--mint-s));
  border-radius:var(--r);padding:16px;margin-bottom:8px}
.side .promo h4{margin:0 0 5px;font-size:.84rem;font-weight:700;color:var(--deep)}
.side .promo p{margin:0;font-size:.73rem;color:var(--ink2);line-height:1.55}
.side .promo .n{font-size:1.15rem;font-weight:800;color:var(--deep);margin-top:6px;display:block}
.side .bot{border-top:1px solid var(--line);padding-top:10px}

.main{flex:1;min-width:0;padding:22px 24px 56px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:1.45rem;margin:0;font-weight:800;letter-spacing:-.03em;flex:0 0 auto}
.top .sp{flex:1}
.search{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;display:flex;align-items:center;gap:9px;color:var(--muted);
  font-size:.84rem;min-width:180px;max-width:320px;flex:1}
.search input{border:0;background:none;padding:0;font-size:.86rem}
.search input:focus{outline:none}
.icons{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px}
.ib{width:36px;height:36px;border-radius:50%;background:var(--mint-s);display:grid;
  place-items:center;color:var(--deep);font-size:.9rem}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px 14px 4px 4px}
.me .av{width:36px;height:36px;border-radius:50%;background:var(--deep);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:.82rem}
.me .nm{font-size:.82rem;font-weight:700;line-height:1.2}
.me .rl{font-size:.7rem;color:var(--muted)}

/* ---------- hero ---------- */
.hero{background:var(--mint-s);border-radius:22px;padding:22px;margin-bottom:16px;
  display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px;align-items:center}
.hero .wel h3{margin:0 0 6px;font-size:1.3rem;font-weight:800;letter-spacing:-.03em;color:var(--deep)}
.hero .wel p{margin:0;font-size:.83rem;color:var(--ink2);line-height:1.65}
.hero .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero .trio{grid-template-columns:1fr}}

/* ---------- kpi ---------- */
.kpi{display:block;width:100%;text-align:right;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.kpi .bd{padding:16px 17px 14px}
.kpi .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.kpi .lab{font-size:.79rem;color:var(--ink2);font-weight:500;line-height:1.45}
.kpi .hz{color:var(--muted);font-weight:600;font-size:.72rem;white-space:nowrap}
.kpi .chip{width:36px;height:36px;border-radius:11px;background:var(--mint-s);color:var(--deep);
  display:grid;place-items:center;font-size:.95rem;flex:0 0 36px}
.kpi .val{font-size:1.5rem;font-weight:800;letter-spacing:-.035em;line-height:1.2;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .unit{font-size:.68rem;color:var(--muted);font-weight:500}
.kpi .ft{background:var(--mint-s);padding:9px 17px;display:flex;justify-content:space-between;
  align-items:center;font-size:.73rem;color:var(--ink2)}
.kpi .ft .go{color:var(--deep);font-weight:700}
.tag{font-size:.69rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.up{background:var(--mint-s2);color:var(--deep)}
.tag.down{background:var(--rose-s);color:var(--rose)}
.tag.warn{background:var(--amber-s);color:var(--amber)}
.kpi.neg .val{color:var(--rose)} .kpi.warn .val{color:var(--amber)} .kpi.pos .val{color:var(--deep)}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1040px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--sh)}
.card h3{font-size:.95rem;margin:0;font-weight:700;letter-spacing:-.01em}
.card .hint{font-size:.74rem;color:var(--muted);margin:3px 0 0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.more{font-size:.73rem;color:var(--deep);background:var(--mint-s);border-radius:999px;
  padding:6px 13px;font-weight:700;white-space:nowrap}

/* ---------- bars ---------- */
.brow{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.brow .nm{flex:0 0 38%;font-size:.79rem;color:var(--ink2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.brow .track{flex:1;background:var(--grey-s);border-radius:7px;height:11px;overflow:hidden}
.brow .fill{height:11px;border-radius:7px;background:var(--mint);display:block}
.brow .fill.alt{background:var(--muted)}
.brow .fill i{display:block;height:11px}
.brow .cnt{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;
  background:var(--grey-s);color:var(--muted);font-size:.67rem;font-weight:700;vertical-align:middle}
.brow .vl{flex:0 0 auto;min-width:60px;text-align:left;font-size:.75rem;font-weight:700;
  direction:ltr;white-space:nowrap}
body.rial .brow .nm{flex:0 0 28%}
body.rial .kpi .val{font-size:1.12rem;letter-spacing:-.02em}
body.rial .ptn .big{font-size:1.1rem}
body.rial td.num{font-size:.78rem}

/* ---------- باکس‌های ماهانه ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
.mbx{text-align:right;background:var(--grey-s);border:1px solid transparent;
  border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.mbx:hover{background:var(--mint-s)}
.mbx.on{background:var(--mint-s);border-color:var(--mint);box-shadow:var(--sh)}
.mbx .mtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mbx .mnm{font-size:.79rem;font-weight:700;color:var(--ink2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mbx .mct{font-size:.67rem;font-weight:700;padding:1px 7px;border-radius:999px;
  background:var(--card);color:var(--muted);flex:0 0 auto}
.mbx .mvl{font-size:1.18rem;font-weight:800;letter-spacing:-.03em;color:var(--deep);
  direction:ltr;text-align:right}
.mbx .mun{font-size:.67rem;color:var(--muted)}
.mbx .msf{font-size:.67rem;color:var(--amber);font-weight:600}
.mbx .msh{font-size:.69rem;color:var(--rose);font-weight:800}
.mbx .msp{font-size:.69rem;color:var(--blue);font-weight:800}
.mbx.sh{border-color:var(--rose)}
.mbx .mnt{font-size:.67rem;color:var(--muted);line-height:1.5}
.mbx.ph{background:transparent;border:1px dashed var(--line)}
.mbx.ph:hover{background:var(--grey-s)}
.mbx .mvl.ph{color:var(--muted)}
.mbx.all{background:var(--mint-s2)}
.mbx.all .mnm{color:var(--deep)}
.mcash{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}
.mcash span{background:var(--grey-s);border-radius:11px;padding:7px 11px;
  font-size:.75rem;font-weight:700;direction:ltr;text-align:right;
  display:flex;flex-direction:column;gap:2px;min-width:92px}
.mcash i{font-style:normal;font-size:.66rem;font-weight:500;color:var(--muted);direction:rtl}
.mcash .eq{background:var(--blue-s);color:var(--blue)}
.mcash .eq.bad{background:var(--rose-s);color:var(--rose)}
.mcash .shb{background:var(--rose-s);color:var(--rose)}
.mbx.od{background:var(--rose-s)} .mbx.od .mvl{color:var(--rose)}
.mbx.od:hover{background:var(--rose-s)}
.mbx.cur{border-color:var(--mint)}
.mdet{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}
.mdh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:.8rem;
  font-weight:700;color:var(--deep);margin-bottom:11px}
.mdh .sm{font-size:.72rem;font-weight:500;color:var(--muted)}
body.rial .mbx .mvl{font-size:.92rem}
@media(max-width:560px){.mgrid{grid-template-columns:repeat(2,1fr)}}

/* ---------- insight panel ---------- */
.panel{background:var(--deep);color:#eaf6f0;border-radius:var(--r);padding:18px}
.panel h3{font-size:.95rem;margin:0 0 14px;font-weight:700}
.ins{display:flex;align-items:flex-start;gap:11px;background:rgba(255,255,255,.07);
  border-radius:14px;padding:12px 13px;margin-bottom:9px;font-size:.81rem;line-height:1.6}
.ins .dot{width:28px;height:28px;border-radius:9px;flex:0 0 28px;display:grid;
  place-items:center;font-size:.8rem;font-weight:700}
.d-warn{background:rgba(224,169,84,.22);color:#f2c37a}
.d-bad{background:rgba(232,123,127,.22);color:#f3a2a4}
.d-good{background:rgba(84,207,150,.22);color:#8ee5b9}
.d-info{background:rgba(255,255,255,.14);color:#cfe9dd}

/* ---------- partner ---------- */
.ptn{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.ptn .nm{font-size:.95rem;font-weight:700}
.ptn .sh{font-size:.73rem;color:var(--muted);margin-bottom:14px}
.ptn .big{font-size:1.45rem;font-weight:800;letter-spacing:-.035em}
.ptn .meter{height:11px;border-radius:7px;background:var(--grey-s);margin:13px 0 10px;overflow:hidden}
.ptn .meter i{display:block;height:11px;border-radius:7px;background:var(--mint)}
.ptn .meter i.low{background:var(--amber)}
.ptn .meter i.bad{background:var(--rose)}
.ptn .legs{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.ptn .legs b{display:block;color:var(--ink);font-size:.87rem;font-weight:800;margin-top:2px}

/* ---------- tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:420px}
th{text-align:right;font-weight:600;color:var(--muted);font-size:.73rem;padding:10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:left;direction:ltr}
th.mid{text-align:center}
td.mid{text-align:center}
td{padding:13px 10px;border-bottom:1px solid var(--line);color:var(--ink2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--mint-s)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left;direction:ltr;
  color:var(--ink);font-weight:700}
td.neg{color:var(--rose)}
.pill{display:inline-block;font-size:.69rem;padding:4px 11px;border-radius:999px;font-weight:700;
  background:var(--grey-s);color:var(--muted);white-space:nowrap}
.pill.p1{background:var(--rose-s);color:var(--rose)}
.pill.p2{background:var(--amber-s);color:var(--amber)}
.pill.p3{background:var(--mint-s2);color:var(--deep)}

.stamp{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;color:var(--ink2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  margin:0 0 18px 8px}
.stamp b{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.stamp.stale b{background:var(--amber)}
.crumb{display:flex;gap:7px;align-items:center;font-size:.81rem;margin:0 0 14px}
.crumb button{color:var(--deep);font-size:.81rem;font-weight:700}
.spin{color:var(--muted);font-size:.85rem;padding:52px 0;text-align:center}
.sub-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sub-nav button{background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-size:.82rem;font-weight:600;color:var(--ink2)}
.sub-nav button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.fs tr.sec td{background:var(--mint-s);font-weight:800;color:var(--deep);font-size:.82rem}
.fs tr.tot td{border-top:2px solid var(--line);font-weight:800;color:var(--ink)}
.fs tr.sub td:first-child{padding-right:26px;color:var(--muted)}
.gap{background:var(--amber-s);color:var(--amber);border-radius:12px;padding:12px 14px;
  font-size:.82rem;margin-bottom:14px;line-height:1.7}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);
  padding:30px 20px;text-align:center;color:var(--muted);font-size:.85rem;line-height:1.8}
.strip{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:.82rem;background:var(--deep);color:#fff;box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.strip.warn{background:var(--amber);color:#2b1c05}
.strip button{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;
  font-weight:700;font-size:.78rem;color:inherit;white-space:nowrap}
.srch{margin-bottom:14px}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.74rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media(max-width:860px){
  .shell{display:block}
  .side{position:fixed;inset:0 0 0 auto;width:262px;transform:translateX(100%);
    transition:transform .22s ease;z-index:40;height:100dvh;
    padding-top:calc(22px + env(safe-area-inset-top,0px));box-shadow:-10px 0 30px rgba(0,0,0,.12)}
  .side.open{transform:translateX(0)}
  .scrim{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:35}
  .main{padding:16px 15px 70px}
  .top h2{font-size:1.2rem}
  .me .nm,.me .rl{display:none}
  .me{padding:4px}
  .kpi .val{font-size:1.32rem}
}
@media(min-width:861px){ #burger,.scrim{display:none} }

/* ---------- افزوده‌های داشبورد باریت ---------- */
select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--canvas);color:var(--ink);font:inherit;font-size:.88rem}
.frm{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px;align-items:end}
.frm label{margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-top:16px;padding:10px 0;color:var(--ink2)}
.chk input{width:18px;height:18px;padding:0}
input[disabled],select[disabled]{opacity:.75}
.btn.sm{width:auto;padding:11px 26px;margin-top:16px}
.btn.ghost{background:var(--mint-s);color:var(--deep)}
.del{color:var(--rose);background:var(--rose-s);width:28px;height:28px;border-radius:9px;font-size:.75rem;font-weight:800}
.srow{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--canvas)}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shead b{font-size:.9rem;flex:1}
.live{position:sticky;top:8px;z-index:20;display:flex;flex-wrap:wrap;gap:8px;background:var(--deep);color:#eaf6f0;border-radius:16px;padding:11px 14px;margin-bottom:14px;box-shadow:var(--sh)}
.live span{background:rgba(255,255,255,.09);border-radius:10px;padding:6px 11px;font-size:.76rem}
.live b{font-weight:800;margin-right:4px}
.chart{width:100%;height:auto;display:block;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.72rem;color:var(--ink2);margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:4px;border-radius:2px;display:inline-block}
.legend .u{color:var(--muted);margin-right:auto}
.brow .fill.neg{background:var(--rose)}
.brow .vl{min-width:170px;direction:rtl;text-align:left}
.tor{display:grid;grid-template-columns:minmax(150px,1.1fr) 2fr minmax(120px,.8fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.8rem}
.tor:last-child{border-bottom:0}
.tor .tn{font-weight:700;color:var(--ink2)}
.tor .tb{display:flex;align-items:center;gap:8px;direction:ltr}
.tor .track{flex:1;background:var(--grey-s);border-radius:7px;height:12px;overflow:hidden;display:flex;justify-content:center}
.tor .fill{background:linear-gradient(90deg,var(--rose),var(--amber) 50%,var(--mint));height:12px;border-radius:7px;display:block}
.tor .lo,.tor .hi{font-size:.72rem;font-weight:700;white-space:nowrap;min-width:78px}
.tor .lo{color:var(--rose);text-align:right}.tor .hi{color:var(--deep)}
.tor .tp{font-size:.72rem;color:var(--muted)}
@media(max-width:700px){.tor{grid-template-columns:1fr}}
.guide p{font-size:.86rem;line-height:2;color:var(--ink2);margin:10px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--card);padding:10px 18px;border-radius:12px;font-size:.84rem;transition:.25s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.top .tools{display:flex;gap:6px;align-items:center}
.pill-btn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.78rem;font-weight:700;color:var(--deep)}
.phint{color:var(--muted);font-size:.78rem;margin:2px 0 0}
#stamps{margin-bottom:6px}
table.asm td{padding:7px 8px;vertical-align:middle}table.asm .vcell input{min-width:150px;padding:8px 10px;direction:ltr;text-align:right}table.asm .vcell .chk{margin:0;padding:0}table.asm .vcell select{min-width:150px;padding:8px}table.asm .conf{width:auto;padding:7px}table.asm .note-in{min-width:240px;padding:8px 10px;font-size:.78rem}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--sh);border-top:4px solid var(--line)}
.wcard.ok{border-top-color:var(--mint)}.wcard.warn{border-top-color:var(--amber)}.wcard.bad{border-top-color:var(--rose)}
.wh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.wh b{flex:1;font-size:.9rem}
.wn{width:24px;height:24px;border-radius:8px;background:var(--grey-s);display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--ink2)}
.auto{font-size:.62rem;background:var(--blue-s);color:var(--blue);border-radius:999px;padding:2px 7px;font-weight:700}
.wi{font-size:.75rem;color:var(--muted);margin:0 0 6px}.wv{font-size:.82rem;font-weight:700;margin:0 0 6px;color:var(--ink)}
.wt{font-size:.74rem;color:var(--deep);background:var(--mint-s);border-radius:9px;padding:6px 9px;margin:0}
.wnote{font-size:.75rem;color:var(--ink2);margin:8px 0 0}.wnote span{color:var(--muted)}
.wedit{display:flex;gap:6px;margin-top:10px}.wedit select{width:auto;padding:7px}.wedit input{padding:7px 10px;font-size:.78rem}
.task{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.task:last-child{border-bottom:0}.task.done .tck{color:var(--muted);text-decoration:line-through}
.tck{display:flex;align-items:center;gap:9px;font-size:.84rem;margin:0;color:var(--ink);flex:1;min-width:260px}
.tck input{width:18px;height:18px;padding:0;flex:0 0 18px}
.tk{font-size:.64rem;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--grey-s);color:var(--ink2);white-space:nowrap}
.tk.gate{background:var(--amber-s);color:var(--amber)}.tk.asm{background:var(--blue-s);color:var(--blue)}
.tmeta{display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--muted)}.tmeta input{width:150px;padding:6px 9px;font-size:.76rem}


</style>
</head>
<body>
<div id="auth" class="auth hide"><div class="authbox">
  <div class="brand"><div class="logo">سایا</div><div><h1>کارخانهٔ پودر باریت سایا</h1></div></div>
  <p class="sub">داشبورد تصمیم‌گیری و نقدینگی — با همان حساب داشبورد سایا نیک وارد شوید.</p>
  <label>ایمیل</label><input id="em" type="email" dir="ltr" autocomplete="username">

</div></div>
<div id="boot" class="spin">در حال بارگذاری…</div>
<div id="app" class="shell hide">
  <aside class="side" id="side">
    <button class="brand" id="brandBtn"><div class="logo">س</div><div><h1>پودر باریت سایا</h1><div class="phint">داشبورد تصمیم</div></div></button>
    <nav id="nav"></nav>
    <div class="promo"><h4>موجودی نقد</h4><span class="n" id="promoN">—</span><p>نقد اولیه + وصولی‌ها − پرداخت‌ها</p></div>
    <div class="bot"><a class="nav" href="../"><span class="ic">↩</span>داشبورد مالی پروژه</a><button class="nav" id="logout"><span class="ic">⏻</span>خروج</button></div>
  </aside>
  <div class="scrim hide" id="scrim"></div>
  <main class="main">
    <div class="top">
      <button class="ib" id="burger" aria-label="منو">☰</button>
      <div><h2 id="ptitle">—</h2><p class="phint" id="phint"></p></div>
      <span class="sp"></span>
      <div class="tools">
        <button class="pill-btn" id="unit" title="واحد پول">تومان</button>
        <div class="icons"><button class="ib" id="reload" title="بارگذاری دوباره">⟳</button><button class="ib" id="theme" title="روشن/تیره">☾</button></div>
        <div class="me"><div class="av" id="meAv">؟</div><div><div class="nm" id="meNm"></div><div class="rl" id="meRl"></div></div></div>
      </div>
    </div>
    <div id="stamps"></div>
    <div id="view"></div>
    <div class="foot"><span>کارخانهٔ پودر باریت سایا · داده‌ها در Supabase · محاسبه با همان منطق فایل امکان‌سنجی</span><span>نسخهٔ ۱</span></div>
  </main>
</div>
<div id="strip" class="strip hide"></div>
<div id="toast" class="toast"></div>
<script src="jalali.js"></script>
<script src="engine.js"></script>
<script src="plan.js"></script>
